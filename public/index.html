<body>
<header class="top">
  <div class="brand">🍔 CANTINHO <span>DOS GIGANTES</span></div>
  <div class="topActions">
    <button id="clientBtn" class="active" onclick="client()">Cliente</button>
    <button id="adminBtn" onclick="adminLogin()">Admin</button>
  </div>
</header>

<main class="wrap"><section id="app"></section></main>
<div id="cart" class="cart hidden"></div>
<div id="modal" class="modal hidden"></div>

<script>
let M=null,B=[],C="Todos",adminToken=sessionStorage.getItem("cg_admin_token")||"";
let adminOrderWatch=null,lastKnownOrderId=0,newOrderQueue=[],audioCtx=null,orderWatchBusy=false,repeatAlertTimer=null;
let pixAutoTimer=null,pixAutoBusy=false,pixAutoPaymentId=null,pixAutoStartedAt=0;

try{
  const saved=JSON.parse(sessionStorage.getItem("cg_pending_order_alerts")||"[]");
  if(Array.isArray(saved))newOrderQueue=saved;
}catch(_e){newOrderQueue=[]}

function sortPendingAlerts(){
  // O alerta sempre prioriza o pedido pendente mais novo.
  // Evita que um pedido antigo salvo na sessão fique preso no canto da tela.
  newOrderQueue.sort((a,b)=>(Number(b.id)||0)-(Number(a.id)||0));
}
function savePendingAlerts(){
  sortPendingAlerts();
  sessionStorage.setItem("cg_pending_order_alerts",JSON.stringify(newOrderQueue));
}
function stopOrderWatch(){
  if(adminOrderWatch){clearInterval(adminOrderWatch);adminOrderWatch=null}
  orderWatchBusy=false;
  stopRepeatingAlert();
}
function orderBeep(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
    const now=audioCtx.currentTime;
    [0,0.18,0.36].forEach((delay,i)=>{
      const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
      osc.type="sine";osc.frequency.value=i===1?880:660;
      gain.gain.setValueAtTime(0.0001,now+delay);
      gain.gain.exponentialRampToValueAtTime(0.18,now+delay+0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+delay+0.14);
      osc.connect(gain);gain.connect(audioCtx.destination);
      osc.start(now+delay);osc.stop(now+delay+0.16);
    });
  }catch(_e){}
}
function dismissOrderAlert(){
  const x=document.getElementById("newOrderToast");
  if(x)x.remove();
}
function pendingOrderById(id){
  return newOrderQueue.find(x=>Number(x.id)===Number(id));
}
function removePendingOrder(id){
  newOrderQueue=newOrderQueue.filter(x=>Number(x.id)!==Number(id));
  savePendingAlerts();
  if(!newOrderQueue.length){
    stopRepeatingAlert();
    dismissOrderAlert();
  }else{
    showOrderAlert(newOrderQueue[0],false);
  }
}
function startRepeatingAlert(){
  if(repeatAlertTimer||!newOrderQueue.length)return;
  orderBeep();
  repeatAlertTimer=setInterval(()=>{
    if(!newOrderQueue.length){stopRepeatingAlert();return}
    orderBeep();
    if(!document.getElementById("newOrderToast"))showOrderAlert(newOrderQueue[0],false);
  },8000);
}
function stopRepeatingAlert(){
  if(repeatAlertTimer){clearInterval(repeatAlertTimer);repeatAlertTimer=null}
}
function showOrderAlert(o,isTest=false){
  dismissOrderAlert();
  const div=document.createElement("div");
  div.id="newOrderToast";
  div.className="newOrderToast";
  const items=(o.items||[]).map(i=>i.quantity+'x '+E(i.name)).join(' • ');
  const paidWaiting=!isTest && (o.account_status==='Fechada' || o.pix_verified);
  const alertTitle=isTest?'TESTE DO ALERTA':(paidWaiting?'PEDIDO PAGO • AGUARDANDO ACEITE!':'NOVO PEDIDO!');
  div.innerHTML=
    '<h3>🔔 '+alertTitle+'</h3>'+
    '<p><b>Pedido #'+E(o.id)+' • '+E(kitchenOrigin(o))+'</b></p>'+
    '<p>'+items+'</p>'+
    '<div class="row">'+
      (isTest
        ? '<button class="btn" id="dismissNewOrderBtn">OK</button>'
        : '<button class="btn" id="acceptNewOrderBtn">✅ ACEITAR PEDIDO</button><button class="secondary" id="openNewOrderBtn">Ver pedidos</button>')+
    '</div>';
  document.body.appendChild(div);

  if(isTest){
    document.getElementById("dismissNewOrderBtn").onclick=dismissOrderAlert;
    orderBeep();
    return;
  }

  document.getElementById("acceptNewOrderBtn").onclick=()=>acceptOrder(Number(o.id));
  document.getElementById("openNewOrderBtn").onclick=()=>orders();
  startRepeatingAlert();
}
async function acceptOrder(id){
  try{
    await api("/api/orders/"+id,{
      method:"PATCH",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({status:"Em preparo"})
    });
    removePendingOrder(id);
    await orders();
  }catch(e){alert(e.message)}
}
async function kitchenStatus(id,status){
  try{
    await api("/api/orders/"+id,{
      method:"PATCH",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({status})
    });
    if(status!=="Recebido")removePendingOrder(id);
    await orders();
  }catch(e){alert(e.message)}
}

async function archiveKitchenOrder(id){
  if(!confirm("Remover este pedido da fila da cozinha?\n\nEle será marcado como ENTREGUE apenas para sair da tela da cozinha. A comanda, o pagamento e o histórico financeiro NÃO serão apagados nem alterados."))return;
  try{
    await api("/api/orders/"+id,{
      method:"PATCH",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({status:"Entregue"})
    });
    removePendingOrder(id);
    await orders();
  }catch(e){alert(e.message)}
}
async function checkNewOrders(){
  if(!adminToken||orderWatchBusy)return;
  orderWatchBusy=true;
  try{
    const a=await api("/api/orders?watch="+Date.now());

    // Remove da fila qualquer pedido que já tenha sido aceito/cancelado.
    const byId=new Map(a.map(o=>[Number(o.id),o]));
    newOrderQueue=newOrderQueue.filter(x=>{
      const current=byId.get(Number(x.id));
      return current && current.status==="Recebido";
    });
    savePendingAlerts();

    const newest=a.length?Math.max(...a.map(o=>Number(o.id)||0)):0;
    if(!lastKnownOrderId){
      lastKnownOrderId=newest;
      sessionStorage.setItem("cg_last_order_id",String(newest));
      if(newOrderQueue.length){
        showOrderAlert(newOrderQueue[0],false);
        startRepeatingAlert();
      }
      return;
    }

    const fresh=a
      .filter(o=>(Number(o.id)||0)>lastKnownOrderId && o.status==="Recebido")
      .sort((x,y)=>Number(x.id)-Number(y.id));

    if(fresh.length){
      lastKnownOrderId=Math.max(lastKnownOrderId,...fresh.map(o=>Number(o.id)||0));
      sessionStorage.setItem("cg_last_order_id",String(lastKnownOrderId));
      for(const o of fresh){
        if(!pendingOrderById(o.id))newOrderQueue.push(o);
      }
      savePendingAlerts();
      showOrderAlert(newOrderQueue[0],false);
      startRepeatingAlert();

      // Se a tela de Pedidos estiver aberta, atualiza a lista automaticamente.
      if(document.getElementById("ordersPanelMarker"))orders();
    }
  }catch(e){
    console.error("Alerta de pedidos:",e);
  }finally{
    orderWatchBusy=false;
  }
}
async function startOrderWatch(){
  stopOrderWatch();
  try{
    const a=await api("/api/orders?watch="+Date.now());
    const byId=new Map(a.map(o=>[Number(o.id),o]));
    newOrderQueue=newOrderQueue.filter(x=>{
      const current=byId.get(Number(x.id));
      return current && current.status==="Recebido";
    });
    savePendingAlerts();

    const newest=a.length?Math.max(...a.map(o=>Number(o.id)||0)):0;
    lastKnownOrderId=newest;
    sessionStorage.setItem("cg_last_order_id",String(newest));

    if(newOrderQueue.length){
      showOrderAlert(newOrderQueue[0],false);
      startRepeatingAlert();
    }
  }catch(e){console.error("Início do alerta:",e)}

  adminOrderWatch=setInterval(checkNewOrders,2000);
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&adminToken)checkNewOrders()});
window.addEventListener("focus",()=>{if(adminToken)checkNewOrders()});
function testOrderAlert(){
  showOrderAlert({id:"TESTE",table_number:"1",items:[{quantity:1,name:"Alerta funcionando"}]},true);
}

const $=x=>document.getElementById(x);
const R=v=>Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const E=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function kitchenOrigin(o){
  if(o && o.account_type==="Avulsa"){
    const name=String(o.customer_name||"").trim();
    return "👤 "+(name||("Comanda #"+(o.account_id||"")));
  }
  return "Mesa "+String(o&&o.table_number);
}

async function api(url,opts={}){
  const headers={...(opts.headers||{})};
  if(adminToken)headers["X-Admin-Token"]=adminToken;

  const r=await fetch(url,{...opts,headers});
  const j=await r.json();

  if(r.status===401 && url!=="/api/admin/login"){
    adminToken="";
    sessionStorage.removeItem("cg_admin_token");
    closeModal();
    setTimeout(()=>{
      alert("Sua sessão administrativa expirou. Entre novamente.");
      adminLogin();
    },0);
    throw Error("Sessão administrativa expirada.");
  }

  if(!r.ok)throw Error(j.error||"Erro");
  return j;
}

function renderMenu(){

  $("products").innerHTML=products.map(p=>{
    const soldOut=Boolean(p.stock_control)&&Number(p.stock_quantity)<=0;
    return '<article class="card">'+
      '<div class="pic"><img loading="lazy" src="'+E(realFoodPhoto(p))+'" alt="'+E(p.name)+'"></div>'+

          '<b class="price">'+R(p.price)+'</b>'+
          (soldOut
            ? '<button class="danger" disabled style="cursor:not-allowed;opacity:.85">ESGOTADO</button>'
            : '<button class="btn" onclick="add('+p.id+')">Adicionar</button>')+

function add(id){
  const p=M.products.find(x=>x.id===id);
  if(!p)return;
  if(Boolean(p.stock_control)&&Number(p.stock_quantity)<=0){
    alert("Este produto está esgotado.");
    return;
  }
  const x=B.find(x=>x.product_id===id);
  x?x.quantity++:B.push({product_id:p.id,name:p.name,price:Number(p.price),quantity:1});
  renderCart();
}

function renderCart(){
  const n=B.reduce((a,x)=>a+x.quantity,0);
  const total=B.reduce((a,x)=>a+x.quantity*x.price,0);
  $("cart").classList.toggle("hidden",!n||$("adminBtn").classList.contains("active"));
  $("cart").innerHTML='🛒 <b>'+n+'</b> itens • <b>'+R(total)+'</b> <button class="btn" onclick="checkout()">Finalizar</button>';
}

  }

}
function pixPaidSuccess(){
  stopPixAutoCheck();
  modal('<div style="text-align:center"><div style="font-size:56px">✅</div><h2>Pagamento confirmado!</h2><p>O PIX foi identificado pelo Mercado Pago e a comanda foi fechada.</p><button class="btn" onclick="closeModal();client()">OK</button></div>');
}
async function checkPix(id,manual=false){
  if(pixAutoBusy)return false;
  pixAutoBusy=true;
  const token=new URLSearchParams(location.search).get("t");
  try{
    const d=await api("/api/client/pix/"+id+"/status?t="+encodeURIComponent(token));
    if(d.paid){pixPaidSuccess();return true}
    const status=String(d.status||"pending");
    setPixAutoStatus("⏳ Aguardando pagamento. Status: "+status+". Verificando automaticamente...");
    if(manual)alert("Pagamento ainda não confirmado. Status: "+status);
    return false;
  }catch(e){
    setPixAutoStatus("⚠️ Não foi possível verificar agora. Tentaremos novamente automaticamente.");
    if(manual)alert(e.message);
    return false;
  }finally{pixAutoBusy=false}
}
function startPixAutoCheck(id){
  stopPixAutoCheck();
  pixAutoPaymentId=Number(id);
  pixAutoStartedAt=Date.now();
  // Primeira consulta após poucos segundos, depois a cada 4 s.
  setTimeout(()=>{if(pixAutoPaymentId===Number(id))checkPix(id,false)},2500);
  pixAutoTimer=setInterval(()=>{
    if(pixAutoPaymentId!==Number(id)){stopPixAutoCheck();return}
    // Depois de 30 minutos o QR já está no limite de validade. Mantém o botão
    // manual disponível, mas interrompe consultas automáticas desnecessárias.
    if(Date.now()-pixAutoStartedAt>30*60*1000){
      setPixAutoStatus("⏱️ A verificação automática foi encerrada. Gere um novo PIX se este tiver expirado.");
      stopPixAutoCheck();return;
    }
    checkPix(id,false);
  },4000);
}

function kitchenAgeInfo(createdAt){
  const created=new Date(createdAt);
  const ageMs=Date.now()-created.getTime();
  const hours=ageMs/3600000;
  if(hours>=48)return {cls:"ageOld",label:"🔴 PEDIDO ANTIGO"};
  const now=new Date();
  const startToday=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const startCreated=new Date(created.getFullYear(),created.getMonth(),created.getDate());
  const days=Math.round((startToday-startCreated)/86400000);
  if(days===0)return {cls:"ageToday",label:"🟢 HOJE"};
  if(days===1)return {cls:"ageYesterday",label:"🟡 ONTEM"};
  return {cls:"ageRecent",label:"🟠 RECENTE"};
}

async function orders(){
  try{
    const a=await api("/api/orders");
    const active=a.filter(o=>o.status!=="Entregue"&&o.status!=="Cancelado");
    const finished=a.filter(o=>o.status==="Entregue"||o.status==="Cancelado");

    const card=o=>{
      const isNew=Boolean(pendingOrderById(o.id));
      const statusClass={
        "Recebido":"statusRecebido",
        "Em preparo":"statusPreparo",
        "Pronto":"statusPronto",
        "Entregue":"statusEntregue",
        "Cancelado":"statusCancelado"
      }[o.status]||"";

      const ageInfo=kitchenAgeInfo(o.created_at);
      const pixClosed = o.account_status==="Fechada" && o.account_payment_method==="PIX";
      const pixVerified = pixClosed && Boolean(o.pix_verified);
      const paymentBadge = pixVerified
        ? '<div><span class="paymentConfirmedBadge">💎 PIX CONFIRMADO • MERCADO PAGO</span></div>'
        : (pixClosed
          ? '<div><span class="paymentConfirmedBadge">✅ CONTA FECHADA • PIX MANUAL</span></div>'
          : '');

      let actions='';
      if(o.status==="Recebido"){
        actions='<button class="kitchenAccept" onclick="acceptOrder('+o.id+')">✅ ACEITAR PEDIDO</button>';
      }else if(o.status==="Em preparo"){
        actions='<button class="kitchenReady" onclick="kitchenStatus('+o.id+',\'Pronto\')">🍳 MARCAR COMO PRONTO</button>';
      }else if(o.status==="Pronto"){
        actions='<button class="kitchenDeliver" onclick="kitchenStatus('+o.id+',\'Entregue\')">✅ ENTREGUE</button>';
      }

      if(o.status!=="Entregue" && o.status!=="Cancelado"){
        actions += '<button class="secondary" onclick="archiveKitchenOrder('+o.id+')">🧹 REMOVER DA FILA</button>';
      }

      return '<div class="order '+(isNew?'newOrder':'')+'">'+
        '<h3>#'+o.id+' — '+E(kitchenOrigin(o))+(isNew?' <span class="newOrderBadge">NOVO</span>':'')+'</h3>'+
        '<p>'+new Date(o.created_at).toLocaleString("pt-BR")+' <span class="kitchenAge '+ageInfo.cls+'">'+ageInfo.label+'</span></p>'+

        (o.observation?'<p><b>Obs.:</b> '+E(o.observation)+'</p>':'')+
        '<h3>'+R(o.total)+'</h3>'+
        paymentBadge+
        '<span class="orderStatus '+statusClass+'">'+E(o.status)+'</span>'+
        (actions?'<div class="kitchenActions">'+actions+'</div>':'')+
      '</div>';

    adminContent.innerHTML=
      '<div class="panel" id="ordersPanelMarker">'+
        '<div class="row"><div><h2 style="margin-bottom:4px">🍳 Pedidos / Cozinha</h2><div style="color:#aaa">O alerta continua tocando até o pedido ser aceito.</div></div>'+
        '<div class="kitchenActions"><button class="secondary" onclick="testOrderAlert()">🔔 Testar alerta</button><button class="secondary" onclick="cleanupOldOrders()">🧹 LIMPAR PEDIDOS ANTIGOS (48H+)</button></div></div>'+
        (active.length

function chooseProductPhoto(input){
  const file=input.files&&input.files[0];
  if(!file)return;

  if(!String(file.type||"").startsWith("image/")){
    alert("Escolha um arquivo de imagem.");
    input.value="";
    return;
  }

  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const maxW=900,maxH=700;
        let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        const scale=Math.min(1,maxW/w,maxH/h);
        w=Math.max(1,Math.round(w*scale));
        h=Math.max(1,Math.round(h*scale));

        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);

        // JPEG reduz bastante o tamanho e mantém boa qualidade para o cardápio.
        const data=canvas.toDataURL("image/jpeg",0.78);
        $("pi").value=data;
        $("productPhotoPreview").style.display="block";
        $("productPhotoPreview").src=data;
      }catch(e){
        alert("Não foi possível preparar esta foto. Tente uma imagem JPG ou PNG.");
      }
    };
    img.onerror=()=>{
      alert("Não foi possível abrir esta foto. Tente uma imagem JPG ou PNG.");
      input.value="";
    };
    img.src=reader.result;
  };
  reader.onerror=()=>alert("Não foi possível ler a foto.");
  reader.readAsDataURL(file);
}

async function stockEntry(id){
  try{

    const note=$("sten").value.trim();

      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({quantity,note})
    });

    alert("Entrada registrada! Estoque: "+r.previous_quantity+" → "+r.stock_quantity+" un.");

    stock();

function exportPeriodCSV(){
  const r=window.__periodReport;
  if(!r){alert("Abra um relatório por período primeiro.");return}

  const rows=[
    ["Relatório por período",r.start,r.end],[],
    ["Resumo"],
    ["Total",r.summary.total],
    ["PIX",r.summary.pix],
    ["Dinheiro",r.summary.dinheiro],
    ["Cartão",r.summary.cartao],
    ["Contas",r.summary.contas],
    ["Ticket médio",r.summary.ticket_medio],
    ["Itens vendidos",r.summary.itens],
    ["Custo dos produtos vendidos",r.summary.custo||0],
    ["Lucro bruto",r.summary.lucro_bruto||0],
    ["Margem de lucro (%)",Number(r.summary.total)>0?(Number(r.summary.lucro_bruto||0)/Number(r.summary.total))*100:0],[],
    ["Resumo por dia"],
    ["Data","Contas","Total"],
    ...r.days.map(d=>[d.day,d.contas,d.total]),[],
    ["Produtos vendidos"],
    ["Produto","Quantidade","Total"],
    ...r.products.map(p=>[p.name,p.quantity,p.total])
  ];

  const csv=rows.map(row=>row.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(";")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="relatorio-periodo-"+r.start+"-a-"+r.end+".csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

            r.accounts.map(a=>'<tr><td>Mesa '+a.table_number+'</td><td>'+new Date(a.closed_at).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})+'</td><td>'+E(a.payment_method||"-")+'</td><td>'+a.order_count+'</td><td>'+R(a.total)+'</td></tr>').join("")+
            '</tbody></table></div>'
          :'<div class="empty">Nenhuma conta fechada nesta data.</div>')+
        '</div>'+
        '<div class="reportSection"><h3>Produtos vendidos</h3>'+
          (r.products.length?
            '<div style="overflow:auto"><table class="reportTable"><thead><tr><th>Produto</th><th>Qtd.</th><th>Total</th></tr></thead><tbody>'+
            r.products.map(p=>'<tr><td>'+E(p.name)+'</td><td>'+p.quantity+'</td><td>'+R(p.total)+'</td></tr>').join("")+
            '</tbody></table></div>'
          :'<div class="empty">Nenhum produto vendido nesta data.</div>')+
        '</div>'+
        '<div class="reportSection"><h3>Fechamentos de caixa</h3>'+
          (r.cash.length?
            r.cash.map(c=>'<div class="saleRow"><div><b>Caixa #'+c.id+'</b><div style="color:#aaa">'+new Date(c.opened_at).toLocaleString("pt-BR")+' → '+new Date(c.closed_at).toLocaleString("pt-BR")+'</div></div><div><b>'+R(c.closing_amount)+'</b><div style="color:#aaa">Esperado: '+R(c.expected_amount)+'</div></div></div>').join("")
          :'<div class="empty">Nenhum fechamento de caixa nesta data.</div>')+
        '</div>'+
      '</div>';
  }catch(e){alert(e.message)}
}

function downloadPeriodReportPdf(){
  const r=window.__periodReport;
  if(!r){alert("Abra primeiro o relatório por período.");return}
  if(!window.jspdf||!window.jspdf.jsPDF){
    alert("Não foi possível carregar o gerador de PDF. Atualize a página e tente novamente.");
    return;
  }

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"mm",format:"a4"});
  const safe=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const money=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  const margin=Number(r.summary.total)>0?(Number(r.summary.lucro_bruto||0)/Number(r.summary.total))*100:0;
  let y=16;

  const checkPage=(need=12)=>{if(y+need>282){doc.addPage();y=16}};
  const title=t=>{
    checkPage(12);
    doc.setFont("helvetica","bold");doc.setFontSize(12);doc.text(safe(t),15,y);y+=7;
    doc.setDrawColor(150);doc.line(15,y,195,y);y+=6;
  };
  const row=(left,right)=>{
    checkPage(7);
    doc.setFont("helvetica","normal");doc.setFontSize(10);
    doc.text(safe(left),18,y);
    if(right!==undefined)doc.text(safe(right),192,y,{align:"right"});
    y+=6;
  };

  doc.setFont("helvetica","bold");doc.setFontSize(18);
  doc.text("CANTINHO DOS GIGANTES",105,y,{align:"center"});y+=9;
  doc.setFontSize(14);doc.text("RELATORIO POR PERIODO",105,y,{align:"center"});y+=7;
  doc.setFont("helvetica","normal");doc.setFontSize(10);
  const startText=new Date(r.start+"T12:00:00").toLocaleDateString("pt-BR");
  const endText=new Date(r.end+"T12:00:00").toLocaleDateString("pt-BR");
  doc.text("Periodo: "+startText+" a "+endText,105,y,{align:"center"});y+=10;

  title("RESUMO");
  row("Faturamento",money(r.summary.total));
  row("PIX",money(r.summary.pix));
  row("Dinheiro",money(r.summary.dinheiro));
  row("Cartao",money(r.summary.cartao));
  row("Contas fechadas",String(r.summary.contas||0));
  row("Ticket medio",money(r.summary.ticket_medio));
  row("Itens vendidos",String(r.summary.itens||0));
  row("Custo dos produtos vendidos",money(r.summary.custo||0));
  row("Lucro bruto",money(r.summary.lucro_bruto||0));
  row("Margem de lucro",margin.toFixed(1).replace(".",",")+"%");

  title("RESUMO POR DIA");
  if((r.days||[]).length){
    for(const d of r.days){
      const dt=new Date(d.day+"T12:00:00").toLocaleDateString("pt-BR");
      row(dt+" | "+d.contas+" conta(s)",money(d.total));
    }
  }else row("Nenhuma venda no periodo.");

  title("PRODUTOS VENDIDOS");
  if((r.products||[]).length){
    for(const p of r.products)row((p.quantity||0)+"x "+safe(p.name),money(p.total));
  }else row("Nenhum produto vendido no periodo.");

  checkPage(18);y+=5;doc.line(15,y,195,y);y+=6;
  doc.setFontSize(8);doc.text("Gerado pelo sistema Cantinho dos Gigantes em "+new Date().toLocaleString("pt-BR"),105,y,{align:"center"});

  doc.save("relatorio-periodo-"+r.start+"-a-"+r.end+".pdf");
}

function exportDailyCSV(){
  const r=window.__dailyReport;
  if(!r){alert("Abra um relatório primeiro.");return}

  const rows=[
    ["Relatório diário",r.date],[],
    ["Resumo"],
    ["Total",r.summary.total],
    ["PIX",r.summary.pix],
    ["Dinheiro",r.summary.dinheiro],
    ["Cartão",r.summary.cartao],
    ["Contas",r.summary.contas],
    ["Faturamento",r.summary.total],
    ["Custo dos produtos vendidos",r.summary.custo],
    ["Lucro bruto",r.summary.lucro_bruto],[],
    ["Contas fechadas"],
    ["Mesa","Fechamento","Pagamento","Pedidos","Valor"],
    ...r.accounts.map(a=>[a.table_number,new Date(a.closed_at).toLocaleString("pt-BR"),a.payment_method||"",a.order_count,a.total]),[],
    ["Produtos vendidos"],
    ["Produto","Quantidade","Total"],
    ...r.products.map(p=>[p.name,p.quantity,p.total])
  ];

  const csv=rows.map(row=>row.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(";")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="relatorio-"+r.date+".csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
