<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cantinho dos Gigantes</title>
<style>
:root{--gold:#d9a300;--gold2:#ffbf00;--black:#080808;--dark:#121212;--panel:#171717;--line:#2b2b2b;--text:#f5f5f5;--muted:#b7b7b7;--red:#b91c1c;--green:#15803d}
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input,textarea,select{font:inherit}
button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
.top{position:sticky;top:0;z-index:30;background:#050505;border-bottom:1px solid #2c2300;padding:13px 18px;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:900;letter-spacing:.4px}.brand span{color:var(--gold2)}
.topActions{display:flex;gap:8px}
.top button{background:#222;color:#fff}.top button.active{background:var(--gold2);color:#111;font-weight:900}
.wrap{max-width:1180px;margin:auto;padding:20px}
.hero{background:radial-gradient(circle at 15% 10%,#2e2400 0,#151515 34%,#080808 75%);border:1px solid #604b00;border-radius:22px;padding:32px;box-shadow:0 10px 35px #0008}
.hero h1{font-size:38px;margin:0 0 8px;color:#ffd34d}
.hero p{color:#ddd;margin-bottom:6px}
.tableTag{display:inline-block;background:#2a2100;color:#ffd34d;border:1px solid #765b00;padding:8px 12px;border-radius:999px;margin-top:8px;font-weight:800}
.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0;padding-bottom:4px}
.tabs button{background:#181818;color:#ddd;border:1px solid #333;white-space:nowrap}
.tabs button.sel{background:var(--gold2);color:#111;border-color:var(--gold2);font-weight:900}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:15px}
.card,.panel,.order{background:var(--panel);border:1px solid var(--line);border-radius:16px}
.card{overflow:hidden}
.pic{height:140px;background:linear-gradient(135deg,#111,#050505);display:grid;place-items:center;font-size:68px;border-bottom:1px solid #2b2300}
.pic img{width:100%;height:100%;object-fit:cover}
.cardBody{padding:16px}
.card h3{margin:0 0 7px;color:#fff}
.card p{color:var(--muted);min-height:40px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{font-weight:900;font-size:20px;color:#ffd34d}
.btn,.primary{background:var(--gold2);color:#111;font-weight:900}
.secondary{background:#2a2a2a;color:#fff}
.danger{background:var(--red);color:#fff}
.cart{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:40;background:#050505;color:#fff;border:1px solid #6d5400;padding:12px 15px;border-radius:15px;box-shadow:0 12px 35px #0009;display:flex;gap:12px;align-items:center}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:50;padding:14px}
.modalBox{width:min(540px,100%);max-height:90vh;overflow:auto;background:#151515;border:1px solid #6b5200;border-radius:18px;padding:20px}
.modalBox h2{color:#ffd34d;margin-top:0}
.field{margin-bottom:11px}.field label{display:block;font-size:12px;font-weight:800;color:#ddd;margin-bottom:5px}
input,textarea,select{width:100%;background:#0c0c0c;color:#fff;border:1px solid #3b3b3b;border-radius:9px;padding:11px}
textarea{min-height:88px}
.panel{padding:18px;margin-bottom:16px}
.panel h2{color:#ffd34d}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.stat{background:#121212;border:1px solid #403200;border-radius:14px;padding:16px}
.stat small{color:#aaa}.stat strong{display:block;font-size:24px;color:#ffd34d;margin-top:5px}
.orders{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
.order{padding:15px}.order h3{margin:0;color:#ffd34d}.order p{color:#ccc}
.order select{margin-top:10px}
.productRow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #2a2a2a}
.productRow:last-child{border-bottom:0}
.productActions{display:flex;gap:7px;flex-wrap:wrap}
.qrGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.qrCard{background:#fff;color:#111;border-radius:15px;padding:15px;text-align:center}
.qrCard img{width:180px;max-width:100%}.qrCard h3{margin:4px 0 10px}.qrCard p{font-size:12px;word-break:break-all}
.empty{color:#aaa;text-align:center;padding:30px}
.notice{background:#211a00;border:1px solid #6a5200;color:#ffe08a;padding:10px 12px;border-radius:10px;margin-bottom:12px}
.clientActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.pixQr{display:block;width:min(280px,100%);margin:14px auto;background:#fff;padding:10px;border-radius:12px}.pixCode{font-size:12px;word-break:break-all;background:#090909;border:1px solid #333;border-radius:10px;padding:10px;color:#ddd;max-height:110px;overflow:auto}
@media(max-width:760px){
  .hero h1{font-size:30px}.stats{grid-template-columns:1fr 1fr}.productRow{align-items:flex-start;flex-direction:column}.wrap{padding:13px}.top{padding:10px}.brand{font-size:14px}.topActions button{padding:8px 10px}
}

.accountGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.accountCard{background:#121212;border:1px solid #4a3900;border-radius:15px;padding:15px}
.accountCard.open{box-shadow:inset 0 0 0 1px #8a6a00}
.accountCard h3{margin:0 0 8px;color:#ffd34d}
.accountTotal{font-size:24px;font-weight:900;color:#ffd34d;margin:10px 0}
.badgeOpen{display:inline-block;background:#3b2f00;color:#ffe17a;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800}
.badgeClosed{display:inline-block;background:#12351f;color:#86efac;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800}
.billOrder{padding:10px 0;border-bottom:1px solid #2a2a2a}
.billOrder:last-child{border-bottom:0}
.paymentGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.paymentGrid button{background:#232323;color:#fff;border:1px solid #3b3b3b}
 .paymentGrid button.selected{background:#ffbf00;color:#111;border-color:#ffbf00;font-weight:900}
.cashSummary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.cashBox{background:#101010;border:1px solid #403200;border-radius:12px;padding:13px}.cashBox small{color:#aaa}.cashBox strong{display:block;color:#ffd34d;font-size:20px;margin-top:5px}
.saleRow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid #2a2a2a}.saleRow:last-child{border-bottom:0}
@media(max-width:760px){
  .accountGrid{grid-template-columns:1fr}
  .paymentGrid{grid-template-columns:1fr}
  .cashSummary{grid-template-columns:1fr 1fr}
}


.reportFilters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.reportFilters .field{margin:0;min-width:180px}
.reportSummary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0 18px}
.reportBox{background:#101010;border:1px solid #403200;border-radius:12px;padding:13px}
.reportBox small{display:block;color:#aaa}
.reportBox strong{display:block;color:#ffd34d;font-size:20px;margin-top:5px}
.reportTable{width:100%;border-collapse:collapse}
.reportTable th,.reportTable td{padding:10px 8px;border-bottom:1px solid #2a2a2a;text-align:left}
.reportTable th{color:#ffd34d;font-size:13px}
.reportSection{margin-top:20px}
@media(max-width:760px){
  .reportSummary{grid-template-columns:1fr 1fr}
  .reportTable{font-size:13px}
}


.printHeader{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff!important;color:#111!important;font-family:Arial,Helvetica,sans-serif!important}
  .top,.stats,.tabs,.cart,.modal,.noPrint{display:none!important}
  .wrap{max-width:none!important;margin:0!important;padding:0!important}
  #app{display:block!important}
  #adminContent{display:block!important}
  .panel{
    background:#fff!important;
    color:#111!important;
    border:0!important;
    box-shadow:none!important;
    padding:0!important;
    margin:0!important;
  }
  .printHeader{
    display:block!important;
    border-bottom:3px solid #b8860b;
    margin-bottom:16px;
    padding-bottom:10px;
  }
  .printHeader h1{margin:0;color:#111!important;font-size:24px}
  .printHeader p{margin:4px 0 0;color:#555!important}
  .reportFilters,.row>button{display:none!important}
  .reportSummary{
    display:grid!important;
    grid-template-columns:repeat(3,1fr)!important;
    gap:8px!important;
    margin:10px 0 16px!important;
  }
  .reportBox{
    background:#fff!important;
    color:#111!important;
    border:1px solid #999!important;
    break-inside:avoid;
    padding:10px!important;
  }
  .reportBox small{color:#555!important}
  .reportBox strong{color:#111!important}
  .reportSection{break-inside:auto;margin-top:16px!important}
  .reportSection h3{color:#111!important;border-bottom:1px solid #aaa;padding-bottom:5px}
  .reportTable{width:100%!important;border-collapse:collapse!important;color:#111!important}
  .reportTable th,.reportTable td{
    color:#111!important;
    border-bottom:1px solid #ccc!important;
    padding:7px 5px!important;
    font-size:11px!important;
  }
  .reportTable th{background:#eee!important}
  .accountCard,.saleRow{
    background:#fff!important;
    color:#111!important;
    border:1px solid #aaa!important;
    break-inside:avoid;
  }
  a{color:#111!important;text-decoration:none!important}
}

</style>
</head>
<body>
<header class="top">
  <div class="brand">🍔 CANTINHO <span>DOS GIGANTES</span></div>
  <div class="topActions">
    <button id="clientBtn" class="active" onclick="client()">Cliente</button>
    <button id="adminBtn" onclick="adminLogin()">Admin</button>
  </div>
</header>

<main class="wrap"><section id="app"></section></main>
<div id="cart" class="cart hidden"></div>
<div id="modal" class="modal hidden"></div>

<script>
let M=null,B=[],C="Todos",adminToken=sessionStorage.getItem("cg_admin_token")||"";
const $=x=>document.getElementById(x);
const R=v=>Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const E=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

async function api(url,opts={}){
  const headers={...(opts.headers||{})};
  if(adminToken)headers["X-Admin-Token"]=adminToken;

  const r=await fetch(url,{...opts,headers});
  const j=await r.json();

  if(r.status===401 && url!=="/api/admin/login"){
    adminToken="";
    sessionStorage.removeItem("cg_admin_token");
    closeModal();
    setTimeout(()=>{
      alert("Sua sessão administrativa expirou. Entre novamente.");
      adminLogin();
    },0);
    throw Error("Sessão administrativa expirada.");
  }

  if(!r.ok)throw Error(j.error||"Erro");
  return j;
}

function setMode(mode){
  $("clientBtn").classList.toggle("active",mode==="client");
  $("adminBtn").classList.toggle("active",mode==="admin");
  $("cart").classList.toggle("hidden",mode==="admin"||B.length===0);
}

function modal(html){
  $("modal").innerHTML='<div class="modalBox">'+html+'</div>';
  $("modal").classList.remove("hidden");
}
function closeModal(){$("modal").classList.add("hidden")}

async function client(){
  setMode("client");
  M=await api("/api/menu");
  const mesa=new URLSearchParams(location.search).get("mesa");

  $("app").innerHTML=
    '<section class="hero">'+
      '<h1>'+E(M.settings.name)+'</h1>'+
      '<p>'+E(M.settings.welcome)+'</p>'+
      (mesa?'<span class="tableTag">🪑 Mesa '+E(mesa)+'</span>':'')+
      (mesa && new URLSearchParams(location.search).get("t")?'<div class="clientActions"><button class="secondary" onclick="myAccount()">🧾 Minha comanda</button></div>':'')+
    '</section>'+
    '<div class="tabs">'+
      ["Todos",...M.categories.map(x=>x.name)].map(c=>
        '<button class="'+(c===C?"sel":"")+'" onclick="C=\''+E(c)+'\';renderMenu()">'+E(c)+'</button>'
      ).join("")+
    '</div>'+
    '<div id="products" class="grid"></div>';

  renderMenu();
}

function renderMenu(){
  const products=M.products.filter(p=>C==="Todos"||p.category===C);
  $("products").innerHTML=products.map(p=>{
    const soldOut=Boolean(p.stock_control)&&Number(p.stock_quantity)<=0;
    return '<article class="card">'+
      '<div class="pic">'+(p.image?'<img src="'+E(p.image)+'">':E(p.emoji))+'</div>'+
      '<div class="cardBody">'+
        '<h3>'+E(p.name)+'</h3>'+
        '<p>'+E(p.description)+'</p>'+
        '<div class="row">'+
          '<b class="price">'+R(p.price)+'</b>'+
          (soldOut
            ? '<button class="danger" disabled style="cursor:not-allowed;opacity:.85">ESGOTADO</button>'
            : '<button class="btn" onclick="add('+p.id+')">Adicionar</button>')+
        '</div>'+
      '</div>'+
    '</article>';
  }).join("")||'<div class="empty">Nenhum produto nesta categoria.</div>';
  renderCart();
}

function add(id){
  const p=M.products.find(x=>x.id===id);
  if(!p)return;
  if(Boolean(p.stock_control)&&Number(p.stock_quantity)<=0){
    alert("Este produto está esgotado.");
    return;
  }
  const x=B.find(x=>x.product_id===id);
  x?x.quantity++:B.push({product_id:p.id,name:p.name,price:Number(p.price),quantity:1});
  renderCart();
}

function renderCart(){
  const n=B.reduce((a,x)=>a+x.quantity,0);
  const total=B.reduce((a,x)=>a+x.quantity*x.price,0);
  $("cart").classList.toggle("hidden",!n||$("adminBtn").classList.contains("active"));
  $("cart").innerHTML='🛒 <b>'+n+'</b> itens • <b>'+R(total)+'</b> <button class="btn" onclick="checkout()">Finalizar</button>';
}

function checkout(){
  if(!B.length)return;
  const mesa=new URLSearchParams(location.search).get("mesa")||prompt("Número da mesa:","1");
  if(!mesa)return;

  const total=B.reduce((a,x)=>a+x.quantity*x.price,0);
  modal(
    '<h2>Confirmar pedido</h2>'+
    '<div class="notice">Mesa <b>'+E(mesa)+'</b></div>'+
    B.map(x=>'<p>'+x.quantity+'x '+E(x.name)+' — <b>'+R(x.quantity*x.price)+'</b></p>').join("")+
    '<hr style="border-color:#333"><h3>Total: '+R(total)+'</h3>'+
    '<div class="field"><label>Observação</label><textarea id="obs" placeholder="Ex.: sem cebola, bem passado..."></textarea></div>'+
    '<button class="btn" onclick="sendOrder('+Number(mesa)+')">Enviar pedido</button> '+
    '<button class="secondary" onclick="closeModal()">Voltar</button>'
  );
}

async function sendOrder(mesa){
  try{
    const r=await api("/api/orders",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        table:mesa,
        items:B.map(x=>({product_id:x.product_id,quantity:x.quantity})),
        observation:$("obs").value
      })
    });
    B=[];renderCart();
    modal(
      '<div style="text-align:center">'+
        '<div style="font-size:56px">✅</div>'+
        '<h2>Pedido enviado!</h2>'+
        '<p>Pedido <b>#'+r.id+'</b> — Mesa '+mesa+'</p>'+
        '<button class="btn" onclick="myAccount()">Ver minha comanda</button> '+
        '<button class="secondary" onclick="closeModal()">OK</button>'+
      '</div>'
    );
  }catch(e){alert(e.message)}
}

async function myAccount(){
  const qs=new URLSearchParams(location.search),mesa=qs.get("mesa"),token=qs.get("t");
  if(!mesa||!token){alert("Abra o cardápio pelo QR Code da sua mesa.");return}
  try{
    const d=await api("/api/client/account/"+encodeURIComponent(mesa)+"?t="+encodeURIComponent(token));
    if(!d.open){modal('<h2>🧾 Minha comanda</h2><div class="empty">Ainda não há pedidos nesta mesa.</div><button class="secondary" onclick="closeModal()">Voltar</button>');return}
    const orders=d.orders.filter(o=>o.status!=="Cancelado");
    modal('<h2>🧾 Minha comanda — Mesa '+E(mesa)+'</h2>'+orders.map(o=>'<div class="billOrder"><b>Pedido #'+o.id+'</b>'+o.items.map(i=>'<div class="row"><span>'+i.quantity+'x '+E(i.name)+'</span><span>'+R(Number(i.unit_price)*i.quantity)+'</span></div>').join('')+'</div>').join('')+'<h2 style="margin-top:16px">Total: '+R(d.total)+'</h2><div class="notice">O pagamento abaixo é somente por PIX.</div><button class="btn" onclick="askPix()">💠 Pagar com PIX</button> <button class="secondary" onclick="closeModal()">Voltar</button>');
  }catch(e){alert(e.message)}
}

function askPix(){
  modal('<h2>💠 Pagar com PIX</h2>'+ 
    '<div class="notice">O QR Code será gerado com o <b>valor exato da sua comanda</b>.</div>'+ 
    '<div class="field"><label>E-mail</label><input id="pixEmail" type="email" autocomplete="email" placeholder="seuemail@exemplo.com"></div>'+ 
    '<button class="btn" onclick="createPix()">Gerar PIX</button> '+
    '<button class="secondary" onclick="myAccount()">Voltar</button>');
}

async function createPix(){
  const qs=new URLSearchParams(location.search),mesa=qs.get("mesa"),token=qs.get("t"),email=$("pixEmail").value.trim();
  if(!email){alert("Informe seu e-mail para gerar o Pix.");return}
  try{
    const d=await api("/api/client/pix",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({table:Number(mesa),token,email})
    });
    const img=d.qr_code_base64?'<img class="pixQr" alt="QR Code Pix" src="data:image/png;base64,'+E(d.qr_code_base64)+'">':'';
    modal('<div style="text-align:center">'+
      '<h2>💠 PIX — '+R(d.amount)+'</h2>'+ 
      '<div class="notice">Confira o valor antes de pagar. Este PIX corresponde à sua comanda atual.</div>'+ 
      '<p>Escaneie o QR Code ou use o Pix Copia e Cola.</p>'+img+
      '<div id="pixCode" class="pixCode">'+E(d.qr_code)+'</div>'+ 
      '<div class="clientActions" style="justify-content:center">'+
        '<button class="btn" onclick="copyPix()">📋 Copiar código PIX</button>'+ 
        '<button class="secondary" onclick="checkPix('+Number(d.payment_id)+')">🔄 Verificar pagamento</button>'+ 
      '</div>'+ 
      '<p style="color:#aaa;font-size:12px">Pagamento processado pelo Mercado Pago.</p>'+ 
      '<button class="secondary" onclick="closeModal()">Fechar</button>'+ 
    '</div>');
  }catch(e){alert(e.message)}
}

async function copyPix(){
  const code=$("pixCode").textContent;
  try{await navigator.clipboard.writeText(code);alert("Código PIX copiado!")}catch(e){alert("Não foi possível copiar automaticamente. Selecione o código e copie manualmente.")}
}

async function checkPix(id){
  const token=new URLSearchParams(location.search).get("t");
  try{
    const d=await api("/api/client/pix/"+id+"/status?t="+encodeURIComponent(token));
    if(d.paid)modal('<div style="text-align:center"><div style="font-size:56px">✅</div><h2>Pagamento confirmado!</h2><p>O PIX foi identificado pelo Mercado Pago.</p><button class="btn" onclick="closeModal()">OK</button></div>');
    else alert("Pagamento ainda não confirmado. Status: "+d.status);
  }catch(e){alert(e.message)}
}

function adminLogin(){
  if(adminToken){dashboard();return}
  setMode("admin");
  modal(
    '<h2>🔐 Área administrativa</h2><div class="notice">Sessão protegida por até 12 horas. Se o servidor reiniciar, o login continua válido.</div>'+
    '<div class="field"><label>Senha</label><input id="pin" type="password" inputmode="numeric" placeholder="Digite a senha"></div>'+
    '<button class="btn" onclick="doLogin()">Entrar</button> '+
    '<button class="secondary" onclick="closeModal();client()">Cancelar</button>'
  );
}

async function doLogin(){
  try{
    const r=await api("/api/admin/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({pin:$("pin").value})
    });
    adminToken=r.token;
    sessionStorage.setItem("cg_admin_token",adminToken);
    closeModal();
    dashboard();
  }catch(e){alert(e.message)}
}

async function dashboard(){
  setMode("admin");
  try{
    const s=await api("/api/stats");
    $("app").innerHTML=
      '<div class="row"><div><h1 style="margin-bottom:4px">Painel administrativo</h1><div style="color:#aaa">Cantinho dos Gigantes</div></div>'+
      '<button class="secondary" onclick="logout()">Sair</button></div>'+
      '<div class="stats">'+
        '<div class="stat"><small>Pedidos</small><strong>'+s.orders+'</strong></div>'+
        '<div class="stat"><small>Mesas abertas</small><strong>'+s.open_tables+'</strong></div>'+
        '<div class="stat"><small>Em aberto</small><strong>'+R(s.open_total)+'</strong></div>'+
        '<div class="stat"><small>Recebido</small><strong>'+R(s.paid_total)+'</strong></div>'+
      '</div>'+
      '<div class="tabs">'+
        '<button onclick="accounts()">🪑 Comandas</button>'+
        '<button onclick="cash()">💰 Caixa</button>'+
        '<button onclick="salesHistory()">📊 Histórico</button>'+
        '<button onclick="dailyReport()">📅 Relatório</button>'+
        '<button onclick="periodReport()">📆 Período</button>'+
        '<button onclick="orders()">🧾 Pedidos</button>'+
        '<button onclick="products()">🍽️ Cardápio</button>'+
        '<button onclick="stock()">📦 Estoque</button>'+
        '<button onclick="stockHistory()">📋 Mov. Estoque</button>'+
        '<button onclick="settings()">⚙️ Configurações</button>'+
        '<button onclick="qrs()">📱 QR Codes</button>'+
      '</div>'+
      '<div id="adminContent"></div>';
    accounts();
  }catch(e){
    adminToken="";sessionStorage.removeItem("cg_admin_token");adminLogin();
  }
}

function logout(){

let stockLowOnly=false;

async function stock(lowOnly){
  try{
    if(typeof lowOnly==="boolean")stockLowOnly=lowOnly;
    const a=await api("/api/stock");
    const controlled=a.filter(p=>p.stock_control);
    const isLow=p=>p.stock_control&&Number(p.stock_quantity)<=Number(p.stock_low_threshold ?? 5);
    const low=controlled.filter(isLow);
    const visible=stockLowOnly?a.filter(isLow):a;
    $("adminContent").innerHTML=
      '<div class="panel">'+
        '<div class="row"><div><h2>📦 Estoque</h2><div style="color:#aaa">'+controlled.length+' produto(s) com controle ativo • '+low.length+' precisando de reposição</div></div></div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0" class="noPrint">'+
          '<button class="'+(stockLowOnly?'btn':'secondary')+'" onclick="stock(true)">⚠️ Somente estoque baixo ('+low.length+')</button>'+
          '<button class="'+(!stockLowOnly?'btn':'secondary')+'" onclick="stock(false)">📦 Mostrar todos</button>'+
          '<button class="secondary" onclick="stockReplenishmentList()">🛒 Lista de reposição</button>'+
        '</div>'+
        '<div class="notice">'+(stockLowOnly?'Mostrando somente produtos controlados que atingiram o limite de estoque baixo.':'Ative o controle nos produtos desejados e informe a quantidade atual. A baixa acontece automaticamente quando o cliente faz o pedido. Se o pedido for cancelado, a quantidade volta ao estoque.')+'</div>'+
        (visible.length?visible.map(p=>{
          const q=Number(p.stock_quantity||0), threshold=Number(p.stock_low_threshold ?? 5), warn=isLow(p);
          return '<div class="productRow">'+
            '<div><b>'+E(p.emoji)+' '+E(p.name)+'</b><div style="color:#aaa;font-size:13px">'+E(p.category)+(p.stock_control?' • Alerta: '+threshold+' un.':'')+'</div></div>'+
            '<div class="productActions" style="align-items:center">'+
              '<span style="font-weight:900;color:'+(warn?'#ffb74d':'#ffd34d')+'">'+(p.stock_control?q+' un.'+(warn?' ⚠️':''):'Sem controle')+'</span>'+
              '<button class="secondary" onclick="stockForm('+p.id+')">Ajustar</button>'+
            '</div></div>';
        }).join(""):'<div class="empty">Nenhum produto com estoque baixo no momento. ✅</div>')+
      '</div>';
    // Ao abrir ou trocar o filtro, leva a tela ao início do painel de estoque,
    // garantindo que os botões do filtro fiquem visíveis.
    requestAnimationFrame(()=>{
      const el=$("adminContent");
      if(el) el.scrollIntoView({behavior:"auto",block:"start"});
    });
  }catch(e){alert(e.message)}
}

async function stockEntry(id){
  try{
    const quantity=Math.floor(Number($("ste").value)||0);
    if(quantity<=0){alert("Informe uma quantidade maior que zero.");return}
    const note=$("sten").value.trim();

    if(!confirm("Registrar entrada de "+quantity+" unidade(s) no estoque?"))return;

    const r=await api("/api/stock/"+id+"/entry",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({quantity,note})
    });

    alert("Entrada registrada! Estoque: "+r.previous_quantity+" → "+r.stock_quantity+" un.");
    closeModal();
    stock();
  }catch(e){alert(e.message)}
}

function closeCashForm(id,expected){
  modal('<h2>Fechar caixa</h2><div class="notice">Dinheiro esperado na gaveta: <b>'+R(expected)+'</b></div>'+ 
    '<div class="field"><label>Valor contado na gaveta</label><input id="cashClosing" type="number" step="0.01" min="0"></div>'+ 
    '<div class="field"><label>Observação (opcional)</label><textarea id="cashNotes"></textarea></div>'+ 
    '<button class="btn" onclick="closeCash('+id+')">Confirmar fechamento</button> <button class="secondary" onclick="closeModal()">Voltar</button>');
}

async function closeCash(id){
  const v=Number($("cashClosing").value);
  if(!Number.isFinite(v)||v<0){alert("Informe o valor contado no caixa.");return}
  if(!confirm("Confirmar fechamento do caixa?"))return;
  try{
    const r=await api("/api/cash/"+id+"/close",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({closing_amount:v,notes:$("cashNotes").value})});
    modal('<div style="text-align:center"><div style="font-size:56px">✅</div><h2>Caixa fechado!</h2><p>Valor contado: <b>'+R(r.session.closing_amount)+'</b></p><p>Diferença: <b>'+R(r.difference)+'</b></p><button class="btn" onclick="closeModal();cash()">OK</button></div>');
  }catch(e){alert(e.message)}
}

async function salesHistory(){
  try{
    const a=await api("/api/sales/history");
    const totals=a.reduce((z,x)=>{const v=Number(x.total);z.total+=v;z[x.payment_method]=(z[x.payment_method]||0)+v;return z},{total:0,PIX:0,Dinheiro:0,"Cartão":0});
    $("adminContent").innerHTML='<div class="panel"><h2>📊 Histórico de vendas</h2>'+ 
      '<div class="cashSummary"><div class="cashBox"><small>Total</small><strong>'+R(totals.total)+'</strong></div><div class="cashBox"><small>PIX</small><strong>'+R(totals.PIX)+'</strong></div><div class="cashBox"><small>Dinheiro</small><strong>'+R(totals.Dinheiro)+'</strong></div><div class="cashBox"><small>Cartão</small><strong>'+R(totals["Cartão"])+'</strong></div></div>'+ 
      (!a.length?'<div class="empty">Nenhuma venda fechada.</div>':a.map(x=>'<div class="saleRow"><div><b>Mesa '+x.table_number+' • '+E(x.payment_method||"")+'</b><div style="color:#aaa">'+new Date(x.closed_at).toLocaleString("pt-BR")+' • '+x.order_count+' pedido(s)</div></div><div class="price">'+R(x.total)+'</div></div>').join(""))+'</div>';
  }catch(e){alert(e.message)}
}


function todayLocal(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}


async function periodReport(start,end){
  try{
    const now=todayLocal();
    const first=start||now.slice(0,8)+"01";
    const last=end||now;

    const r=await api("/api/reports/period?start="+encodeURIComponent(first)+"&end="+encodeURIComponent(last));
    window.__periodReport=r;

    $("adminContent").innerHTML=
      '<div class="panel">'+
        '<div class="printHeader"><h1>Cantinho dos Gigantes</h1><p>Relatório por período - '+new Date(first+'T12:00:00').toLocaleDateString("pt-BR")+' a '+new Date(last+'T12:00:00').toLocaleDateString("pt-BR")+'</p></div>'+ 
        '<div class="row"><h2>📆 Relatório por período</h2><div class="noPrint"><button class="secondary" onclick="printPeriodReport()">🖨️ Imprimir / Salvar PDF</button> <button class="secondary" onclick="exportPeriodCSV()">Exportar CSV</button></div></div>'+
        '<div class="reportFilters">'+
          '<div class="field"><label>Data inicial</label><input id="periodStart" type="date" value="'+E(first)+'"></div>'+
          '<div class="field"><label>Data final</label><input id="periodEnd" type="date" value="'+E(last)+'"></div>'+
          '<button class="btn" onclick="periodReport($(\'periodStart\').value,$(\'periodEnd\').value)">Buscar</button>'+
        '</div>'+
        '<div class="reportSummary">'+
          '<div class="reportBox"><small>Total</small><strong>'+R(r.summary.total)+'</strong></div>'+
          '<div class="reportBox"><small>PIX</small><strong>'+R(r.summary.pix)+'</strong></div>'+
          '<div class="reportBox"><small>Dinheiro</small><strong>'+R(r.summary.dinheiro)+'</strong></div>'+
          '<div class="reportBox"><small>Cartão</small><strong>'+R(r.summary.cartao)+'</strong></div>'+
          '<div class="reportBox"><small>Contas</small><strong>'+r.summary.contas+'</strong></div>'+
          '<div class="reportBox"><small>Ticket médio</small><strong>'+R(r.summary.ticket_medio)+'</strong></div>'+
          '<div class="reportBox"><small>Itens vendidos</small><strong>'+r.summary.itens+'</strong></div>'+
        '</div>'+
        '<div class="reportSection"><h3>Resumo por dia</h3>'+
          (r.days.length?
            '<div style="overflow:auto"><table class="reportTable"><thead><tr><th>Data</th><th>Contas</th><th>Total</th></tr></thead><tbody>'+
            r.days.map(d=>'<tr><td>'+new Date(d.day+"T12:00:00").toLocaleDateString("pt-BR")+'</td><td>'+d.contas+'</td><td>'+R(d.total)+'</td></tr>').join("")+
            '</tbody></table></div>'
          :'<div class="empty">Nenhuma venda no período.</div>')+
        '</div>'+
        '<div class="reportSection"><h3>Produtos vendidos</h3>'+
          (r.products.length?
            '<div style="overflow:auto"><table class="reportTable"><thead><tr><th>Produto</th><th>Qtd.</th><th>Total</th></tr></thead><tbody>'+
            r.products.map(p=>'<tr><td>'+E(p.name)+'</td><td>'+p.quantity+'</td><td>'+R(p.total)+'</td></tr>').join("")+
            '</tbody></table></div>'
          :'<div class="empty">Nenhum produto vendido no período.</div>')+
        '</div>'+
      '</div>';
  }catch(e){alert(e.message)}
}

function exportPeriodCSV(){
  const r=window.__periodReport;
  if(!r){alert("Abra um relatório por período primeiro.");return}

  const rows=[
    ["Relatório por período",r.start,r.end],[],
    ["Resumo"],
    ["Total",r.summary.total],
    ["PIX",r.summary.pix],
    ["Dinheiro",r.summary.dinheiro],
    ["Cartão",r.summary.cartao],
    ["Contas",r.summary.contas],
    ["Ticket médio",r.summary.ticket_medio],
    ["Itens vendidos",r.summary.itens],[],
    ["Resumo por dia"],
    ["Data","Contas","Total"],
    ...r.days.map(d=>[d.day,d.contas,d.total]),[],
    ["Produtos vendidos"],
    ["Produto","Quantidade","Total"],
    ...r.products.map(p=>[p.name,p.quantity,p.total])
  ];

  const csv=rows.map(row=>row.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(";")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="relatorio-periodo-"+r.start+"-a-"+r.end+".csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function qrs(){

      const q=await api("/api/qrcode/"+i);

          '<h3>MESA '+i+'</h3>'+
