<body>
<header class="top">
  <div class="brand">🍔 CANTINHO <span>DOS GIGANTES</span></div>
  <div class="topActions">
    <button id="clientBtn" class="active" onclick="client()">Cliente</button>
    <button id="adminBtn" onclick="adminLogin()">Admin</button>
  </div>
</header>

<main class="wrap"><section id="app"></section></main>
<div id="cart" class="cart hidden"></div>
<div id="modal" class="modal hidden"></div>

<script>
let M=null,B=[],C="Todos",adminToken=sessionStorage.getItem("cg_admin_token")||"";
let pixAutoTimer=null,pixAutoPaymentId=null,pixAutoStartedAt=0;
let adminOrderWatch=null,lastKnownOrderId=0,newOrderQueue=[],audioCtx=null,orderWatchBusy=false,repeatAlertTimer=null;

try{
  const saved=JSON.parse(sessionStorage.getItem("cg_pending_order_alerts")||"[]");
  if(Array.isArray(saved))newOrderQueue=saved;
}catch(_e){newOrderQueue=[]}

function savePendingAlerts(){
  sessionStorage.setItem("cg_pending_order_alerts",JSON.stringify(newOrderQueue));
}
function stopOrderWatch(){
  if(adminOrderWatch){clearInterval(adminOrderWatch);adminOrderWatch=null}
  orderWatchBusy=false;
  stopRepeatingAlert();
}
function orderBeep(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
    const now=audioCtx.currentTime;
    [0,0.18,0.36].forEach((delay,i)=>{
      const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
      osc.type="sine";osc.frequency.value=i===1?880:660;
      gain.gain.setValueAtTime(0.0001,now+delay);
      gain.gain.exponentialRampToValueAtTime(0.18,now+delay+0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+delay+0.14);
      osc.connect(gain);gain.connect(audioCtx.destination);
      osc.start(now+delay);osc.stop(now+delay+0.16);
    });
  }catch(_e){}
}
function dismissOrderAlert(){
  const x=document.getElementById("newOrderToast");
  if(x)x.remove();
}
function pendingOrderById(id){
  return newOrderQueue.find(x=>Number(x.id)===Number(id));
}
function removePendingOrder(id){
  newOrderQueue=newOrderQueue.filter(x=>Number(x.id)!==Number(id));
  savePendingAlerts();
  if(!newOrderQueue.length){
    stopRepeatingAlert();
    dismissOrderAlert();
  }else{
    showOrderAlert(newOrderQueue[0],false);
  }
}
function startRepeatingAlert(){
  if(repeatAlertTimer||!newOrderQueue.length)return;
  orderBeep();
  repeatAlertTimer=setInterval(()=>{
    if(!newOrderQueue.length){stopRepeatingAlert();return}
    orderBeep();
    if(!document.getElementById("newOrderToast"))showOrderAlert(newOrderQueue[0],false);
  },8000);
}
function stopRepeatingAlert(){
  if(repeatAlertTimer){clearInterval(repeatAlertTimer);repeatAlertTimer=null}
}
function showOrderAlert(o,isTest=false){
  dismissOrderAlert();
  const div=document.createElement("div");
  div.id="newOrderToast";
  div.className="newOrderToast";
  const items=(o.items||[]).map(i=>i.quantity+'x '+E(i.name)).join(' • ');
  div.innerHTML=
    '<h3>🔔 '+(isTest?'TESTE DO ALERTA':'NOVO PEDIDO!')+'</h3>'+
    '<p><b>Pedido #'+E(o.id)+' • '+E(orderLabel(o))+'</b></p>'+
    '<p>'+items+'</p>'+
    '<div class="row">'+
      (isTest
        ? '<button class="btn" id="dismissNewOrderBtn">OK</button>'
        : '<button class="btn" id="acceptNewOrderBtn">✅ ACEITAR PEDIDO</button><button class="secondary" id="openNewOrderBtn">Ver pedidos</button>')+
    '</div>';
  document.body.appendChild(div);

  if(isTest){
    document.getElementById("dismissNewOrderBtn").onclick=dismissOrderAlert;
    orderBeep();
    return;
  }

  document.getElementById("acceptNewOrderBtn").onclick=()=>acceptOrder(Number(o.id));
  document.getElementById("openNewOrderBtn").onclick=()=>orders();
  startRepeatingAlert();
}
async function acceptOrder(id){
  try{
    await api("/api/orders/"+id,{
      method:"PATCH",

async function checkNewOrders(){
  if(!adminToken||orderWatchBusy)return;
  orderWatchBusy=true;
  try{
    const a=await api("/api/orders?watch="+Date.now());

    // Remove da fila qualquer pedido que já tenha sido aceito/cancelado.
    const byId=new Map(a.map(o=>[Number(o.id),o]));
    newOrderQueue=newOrderQueue.filter(x=>{
      const current=byId.get(Number(x.id));
      return current && current.status==="Recebido" && current.account_status==="Aberta";
    });
    savePendingAlerts();

    const newest=a.length?Math.max(...a.map(o=>Number(o.id)||0)):0;
    if(!lastKnownOrderId){
      lastKnownOrderId=newest;
      sessionStorage.setItem("cg_last_order_id",String(newest));
      if(newOrderQueue.length){
        showOrderAlert(newOrderQueue[0],false);
        startRepeatingAlert();
      }
      return;
    }

    const fresh=a
      .filter(o=>(Number(o.id)||0)>lastKnownOrderId && o.status==="Recebido" && o.account_status==="Aberta")
      .sort((x,y)=>Number(x.id)-Number(y.id));

    if(fresh.length){
      lastKnownOrderId=Math.max(lastKnownOrderId,...fresh.map(o=>Number(o.id)||0));
      sessionStorage.setItem("cg_last_order_id",String(lastKnownOrderId));
      for(const o of fresh){
        if(!pendingOrderById(o.id))newOrderQueue.push(o);
      }
      savePendingAlerts();
      showOrderAlert(newOrderQueue[0],false);
      startRepeatingAlert();

      // Se a tela de Pedidos estiver aberta, atualiza a lista automaticamente.
      if(document.getElementById("ordersPanelMarker"))orders();
    }
  }catch(e){
    console.error("Alerta de pedidos:",e);
  }finally{
    orderWatchBusy=false;
  }
}
async function startOrderWatch(){
  stopOrderWatch();
  try{
    const a=await api("/api/orders?watch="+Date.now());
    const byId=new Map(a.map(o=>[Number(o.id),o]));
    newOrderQueue=newOrderQueue.filter(x=>{
      const current=byId.get(Number(x.id));
      return current && current.status==="Recebido" && current.account_status==="Aberta";
    });
    savePendingAlerts();

    const newest=a.length?Math.max(...a.map(o=>Number(o.id)||0)):0;
    lastKnownOrderId=newest;
    sessionStorage.setItem("cg_last_order_id",String(newest));

    if(newOrderQueue.length){
      showOrderAlert(newOrderQueue[0],false);
      startRepeatingAlert();
    }
  }catch(e){console.error("Início do alerta:",e)}

  adminOrderWatch=setInterval(checkNewOrders,2000);
}

async function api(url,opts={}){
  const headers={...(opts.headers||{})};
  if(adminToken)headers["X-Admin-Token"]=adminToken;

  let r;
  try{
    r=await fetch(url,{...opts,headers});
  }catch(e){
    throw Error("Não foi possível conectar ao servidor. Verifique sua internet e tente novamente.");
  }

  const raw=await r.text();
  let j={};
  if(raw){
    try{j=JSON.parse(raw)}catch(e){
      console.error("Resposta não JSON da API",url,r.status,raw.slice(0,300));
      throw Error(r.ok?"O servidor enviou uma resposta inválida. Tente novamente.":"O servidor está temporariamente indisponível. Tente novamente em instantes.");
    }
  }

  if(r.status===401 && url!=="/api/admin/login"){
    adminToken="";
    sessionStorage.removeItem("cg_admin_token");
    closeModal();
    setTimeout(()=>{
      alert("Sua sessão administrativa expirou. Entre novamente.");
      adminLogin();
    },0);
    throw Error("Sessão administrativa expirada.");
  }

  if(!r.ok)throw Error(j.error||"Erro no servidor.");
  return j;
}

function isWineProduct(p){
  return String(p?.category||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().includes("vinho");
}

function wineVintageLabel(v){
  const raw=String(v||"").trim();
  if(!raw)return "";
  if(/^\d{4}$/.test(raw))return "Safra "+raw;
  if(/^(nao|não)\s+safrado$/i.test(raw))return "Não safrado";
  return "";
}

function wineMetaHtml(p){
  if(!isWineProduct(p))return "";
  const bits=[];
  if(p.wine_type)bits.push("🍷 "+E(p.wine_type));
  if(p.wine_grape)bits.push("🍇 "+E(p.wine_grape));
  if(p.wine_origin)bits.push("📍 "+E(p.wine_origin));
  const vintage=wineVintageLabel(p.wine_vintage);
  if(vintage)bits.push("🗓️ "+E(vintage));
  if(Number(p.wine_volume_ml)>0)bits.push("🍾 "+Number(p.wine_volume_ml)+" ml");
  return bits.length?'<div class="wineMeta">'+bits.map(x=>'<span class="wineChip">'+x+'</span>').join("")+'</div>':"";
}

function startPixAutoCheck(id){
  stopPixAutoCheck();
  pixAutoPaymentId=Number(id);
  pixAutoStartedAt=Date.now();
  let checking=false;
  const run=async()=>{
    if(checking||pixAutoPaymentId!==Number(id))return;
    if(Date.now()-pixAutoStartedAt>10*60*1000){
      stopPixAutoCheck();
      const el=$("pixAutoStatus");
      if(el)el.textContent="A verificação automática foi pausada. Use ‘Verificar pagamento’ se necessário.";
      return;
    }
    checking=true;
    try{
      const d=await checkPix(id,{silent:true});
      if(d&&!d.paid){
        const el=$("pixAutoStatus");
        if(el)el.textContent="Aguardando confirmação do PIX…";
      }
    }finally{checking=false}
  };
  pixAutoTimer=setInterval(run,5000);
  setTimeout(run,1800);
}

function accountDisplayLabel(x){
  return x&&x.account_type==="Comanda QR"
    ? "Comanda "+String(x.customer_name||"")
    : "Mesa "+String((x&&x.table_number)!=null?x.table_number:"");
}

let accountSearch="",accountTypeFilter="all";
function normalizeAccountSearch(v){
  return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
}
function filterOpenAccounts(open){
  const q=normalizeAccountSearch(accountSearch);
  return open.filter(x=>{
    if(accountTypeFilter==="mesa"&&x.account_type==="Comanda QR")return false;
    if(accountTypeFilter==="qr"&&x.account_type!=="Comanda QR")return false;
    if(!q)return true;
    const label=x.account_type==="Comanda QR"
      ? "comanda "+String(x.customer_name||"")
      : "mesa "+String(x.table_number??"");
    const hay=normalizeAccountSearch(label+" "+String(x.customer_name||"")+" "+String(x.table_number??""));
    return hay.includes(q);
  });
}
function renderOpenAccountList(open){
  const filtered=filterOpenAccounts(open);
  const root=$("openAccountsResults");
  const count=$("openAccountsCount");
  if(count)count.textContent=filtered.length+" de "+open.length+" aberta(s)";
  if(!root)return;

    ? '<div class="accountGrid">'+filtered.map(x=>
        '<div class="accountCard open">'+
          '<span class="badgeOpen">ABERTA</span>'+
          '<h3>'+(x.account_type==="Comanda QR"?'🎟️ Comanda '+E(x.customer_name):'🪑 Mesa '+x.table_number)+'</h3>'+
          '<div>'+x.order_count+' pedido(s)</div>'+

async function cancelOrderFromAccount(orderId,tableNumber){
  if(!confirm(
    "Cancelar o Pedido #"+orderId+"?\n\n"+
    "O pedido continuará no histórico como CANCELADO. Itens com controle de estoque serão devolvidos automaticamente."

      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({status:"Cancelado"})
    });

    if(r.account_closed){

        "Pedido #"+orderId+" cancelado.\n"+
        (Number(r.restored_units||0)>0?"Estoque devolvido: "+Number(r.restored_units)+" unidade(s).\n":"")+

function kitchenAgeInfo(createdAt){
  const created=new Date(createdAt);
  const ageMs=Date.now()-created.getTime();
  const hours=ageMs/3600000;
  if(hours>=48)return {cls:"ageOld",label:"🔴 PEDIDO ANTIGO"};
  const now=new Date();
  const startToday=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const startCreated=new Date(created.getFullYear(),created.getMonth(),created.getDate());
  const days=Math.round((startToday-startCreated)/86400000);
  if(days===0)return {cls:"ageToday",label:"🟢 HOJE"};
  if(days===1)return {cls:"ageYesterday",label:"🟡 ONTEM"};
  return {cls:"ageRecent",label:"🟠 RECENTE"};
}

async function orders(){
  try{
    const a=await api("/api/orders");
    // V81: uma conta já fechada/paga não pode continuar como trabalho ativo da cozinha,
    // mesmo que um registro histórico antigo ainda tenha status Recebido/Em preparo/Pronto.
    const accountClosed=o=>o.account_status==="Fechada";
    const active=a.filter(o=>!accountClosed(o)&&o.status!=="Entregue"&&o.status!=="Cancelado");
    const finished=a.filter(o=>accountClosed(o)||o.status==="Entregue"||o.status==="Cancelado");

    const card=o=>{
      const isNew=Boolean(pendingOrderById(o.id));
      const statusClass={
        "Recebido":"statusRecebido",
        "Em preparo":"statusPreparo",
        "Pronto":"statusPronto",
        "Entregue":"statusEntregue",
        "Cancelado":"statusCancelado"
      }[o.status]||"";

      const ageInfo=kitchenAgeInfo(o.created_at);
      const pixConfirmed = o.account_status==="Fechada" && o.account_payment_method==="PIX";
      const paymentBadge = pixConfirmed
        ? '<div><span class="paymentConfirmedBadge">💎 PIX CONFIRMADO • COMANDA PAGA</span></div>'
        : '';

      let actions='';
      // Contas fechadas são somente histórico: nunca podem voltar a exibir ações operacionais.
      if(!accountClosed(o)){
        if(o.status==="Recebido"){
          actions='<button class="kitchenAccept" onclick="acceptOrder('+o.id+')">✅ ACEITAR PEDIDO</button>';
        }else if(o.status==="Em preparo"){
          actions='<button class="kitchenReady" onclick="kitchenStatus('+o.id+',\'Pronto\')">🍳 MARCAR COMO PRONTO</button>';
        }else if(o.status==="Pronto"){
          actions='<button class="kitchenDeliver" onclick="kitchenStatus('+o.id+',\'Entregue\')">✅ ENTREGUE</button>';
        }

        if(o.status!=="Entregue" && o.status!=="Cancelado"){
          actions += '<button class="secondary" onclick="archiveKitchenOrder('+o.id+')">🧹 REMOVER DA FILA</button>';
        }
      }

      return '<div class="order '+(isNew?'newOrder':'')+'">'+
        '<h3>#'+o.id+' — '+E(orderLabel(o))+(isNew?' <span class="newOrderBadge">NOVO</span>':'')+'</h3>'+
        '<p>'+new Date(o.created_at).toLocaleString("pt-BR")+' <span class="kitchenAge '+ageInfo.cls+'">'+ageInfo.label+'</span></p>'+
        o.items.map(i=>'<div><b>'+i.quantity+'x</b> '+E(i.name)+'</div>').join("")+
        (o.observation?'<p><b>Obs.:</b> '+E(o.observation)+'</p>':'')+
        '<h3>'+R(o.total)+'</h3>'+
        paymentBadge+
        '<span class="orderStatus '+statusClass+'">'+E(accountClosed(o)?"Pago / encerrado":o.status)+'</span>'+
        (actions?'<div class="kitchenActions">'+actions+'</div>':'')+
      '</div>';
    };

    $("adminContent").innerHTML=
      '<div class="panel" id="ordersPanelMarker">'+
        '<div class="row"><div><h2 style="margin-bottom:4px">🍳 Pedidos / Cozinha</h2><div style="color:#aaa">O alerta continua tocando até o pedido ser aceito.</div></div>'+
        '<div class="kitchenActions"><button class="secondary" onclick="testOrderAlert()">🔔 Testar alerta</button><button class="secondary" onclick="cleanupOldOrders()">🧹 LIMPAR PEDIDOS ANTIGOS (48H+)</button></div></div>'+
        (active.length
          ? '<div class="orders" style="margin-top:14px">'+active.map(card).join("")+'</div>'
          : '<div class="empty">Nenhum pedido aguardando preparo.</div>')+
      '</div>'+
      (finished.length
        ? '<div class="panel"><h2>Últimos finalizados</h2><div class="orders">'+finished.slice(0,12).map(card).join("")+'</div></div>'
        : '');

    if(newOrderQueue.length)startRepeatingAlert();
  }catch(e){alert(e.message)}
}

async function cleanupOldOrders(){
  if(!confirm("Remover da fila TODOS os pedidos ativos com 48 horas ou mais?\n\nEles serão marcados como ENTREGUES somente para sair da cozinha. Histórico, vendas e pagamentos serão preservados."))return;
  try{
    const r=await api("/api/admin/orders/cleanup-old-48h",{
      method:"POST",
      headers:{"Content-Type":"application/json"}
    });
    alert(r.updated
      ? r.updated+" pedido(s) com 48 horas ou mais foram removidos da fila."
      : "Nenhum pedido ativo com 48 horas ou mais foi encontrado.");
    newOrderQueue=newOrderQueue.filter(x=>!r.ids.includes(Number(x.id)));
    savePendingAlerts();
    if(!newOrderQueue.length)stopRepeatingAlert();
    await orders();
  }catch(e){alert(e.message)}
}


let adminProductCache=[];

function normalizeProductSearch(v){
  return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
}

function renderProductAdminList(){
  const q=normalizeProductSearch($("productSearch")?.value||"");
  const category=$("productCategoryFilter")?.value||"";
  const quick=$("productQuickFilter")?.value||"all";
  const activeProducts=adminProductCache.filter(p=>p.active!==false);
  const archivedProducts=adminProductCache.filter(p=>p.active===false);
  const base=quick==="archived"?archivedProducts:activeProducts;
  const rows=base.filter(p=>{
    const hay=normalizeProductSearch([p.name,p.category,p.description,p.emoji].join(" "));
    if(q&&!hay.includes(q))return false;
    if(category&&String(p.category)!==category)return false;
    const cost=Number(p.cost_price||0);
    const stock=Number(p.stock_quantity||0);
    const threshold=Number(p.stock_low_threshold||0);
    if(quick==="nocost"&&cost>0)return false;
    if(quick==="lowstock"&&!(p.stock_control&&stock<=threshold))return false;
    if(quick==="stock"&&!p.stock_control)return false;
    return true;
  });

  const box=$("productAdminResults");
  const count=$("productResultCount");
  if(count){
    const suffix=quick==="archived"?" arquivado(s)":" ativo(s)";
    count.textContent=rows.length+" de "+base.length+" produto(s)"+suffix+(archivedProducts.length?" • "+archivedProducts.length+" arquivado(s) no total":"");
  }
  if(!box)return;
  box.innerHTML=rows.length?rows.map(p=>{
    const price=Number(p.price||0);
    const cost=Number(p.cost_price||0);
    const profit=price-cost;
    const margin=price>0?(profit/price)*100:0;
    const low=p.stock_control&&Number(p.stock_quantity||0)<=Number(p.stock_low_threshold||0);
    const archived=p.active===false;
    return '<div class="productRow" style="'+(archived?'opacity:.78;border-left:3px solid #666;padding-left:12px':'')+'">'+
      '<div style="min-width:0">'+
        '<b>'+E(p.emoji)+' '+E(p.name)+'</b>'+ (archived?' <span style="color:#aaa;font-size:12px;font-weight:900">📦 ARQUIVADO</span>':(low?' <span style="color:#ffb74d;font-size:12px;font-weight:900">⚠️ ESTOQUE BAIXO</span>':''))+
        '<div style="color:#aaa;font-size:13px">'+E(p.category)+' • Venda: '+R(price)+'</div>'+ 
        '<div style="font-size:13px;margin-top:4px">'+
          (cost>0?('<span style="color:#aaa">Custo: '+R(cost)+'</span> • <span style="color:#ffd34d;font-weight:800">Lucro: '+R(profit)+'</span> • <span style="color:#aaa">Margem: '+margin.toFixed(1).replace(".",",")+'%</span>'):'<span style="color:#ffb74d;font-weight:800">⚠️ Custo não informado</span>')+
        '</div>'+ 
      '</div>'+ 
      '<div class="productActions">'+
        (archived
          ? '<button class="btn" onclick="restoreProduct('+p.id+')">↩️ Restaurar</button>'
          : '<button class="secondary" onclick="productForm('+p.id+')">Editar</button><button class="danger" onclick="deleteProduct('+p.id+')">📦 Arquivar</button>')+
      '</div>'+ 
    '</div>';
  }).join(""):'<div class="empty" style="padding:28px 12px">🔎 Nenhum produto encontrado com esses filtros.</div>';
}

function toggleWineFields(){
  const sel=$("pc"),wrap=$("wineFields");
  if(!sel||!wrap)return;
  const name=String(sel.options[sel.selectedIndex]?.text||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  const wine=name.includes("vinho");
  wrap.style.display=wine?"block":"none";
  if(wine && $("pe") && (!$("pe").value || $("pe").value==="🍽️"))$("pe").value="🍷";
}

function updateProductFinancePreview(){
  const pp=$("pp"), pc=$("pcost");
  if(!pp||!pc)return;
  const price=Math.max(0,Number(pp.value)||0), cost=Math.max(0,Number(pc.value)||0);
  const hasCost=cost>0;
  const profit=hasCost?(price-cost):null;
  const margin=hasCost&&price>0?(profit/price)*100:null;
  if($("pfProfit"))$("pfProfit").textContent=hasCost?R(profit):"—";
  if($("pfMargin"))$("pfMargin").textContent=hasCost?margin.toFixed(1).replace(".",",")+"%":"—";
  if($("pfSale"))$("pfSale").textContent=R(price);
  if($("pfCostNotice"))$("pfCostNotice").style.display=hasCost?"none":"block";
  if($("pfProfit"))$("pfProfit").style.color=!hasCost?"#aaa":profit<0?"#ff6b6b":"#ffd34d";
  if($("pfMargin"))$("pfMargin").style.color=!hasCost?"#aaa":margin<20?"#ff6b6b":margin<40?"#ffb74d":"#79e28a";
}

function toggleProductStockFields(){
  const check=$("psc"), wrap=$("productStockFields"), hint=$("stockInactiveHint");
  if(!check||!wrap)return;
  wrap.style.display=check.checked?"grid":"none";
  if(hint)hint.style.display=check.checked?"none":"block";
}

async function chooseProductPhoto(input){
  try{
    const file=input.files&&input.files[0];
    if(!file)return;
    if(!/^image\/(jpeg|png|webp)$/i.test(file.type)){
      alert("Escolha uma imagem JPG, PNG ou WEBP.");
      input.value="";
      return;
    }
    if(file.size>12*1024*1024){
      alert("A foto é muito grande. Escolha uma imagem de até 12 MB.");
      input.value="";
      return;
    }
    const dataUrl=await resizeProductPhoto(file);
    $("pi").value=dataUrl;
    const img=$("photoPreview"),wrap=$("photoPreviewWrap");
    if(img)img.src=dataUrl;
    if(wrap)wrap.style.display="block";
    const rb=$("removePhotoBtn"),st=$("photoStatus");
    if(rb)rb.style.display="";
    if(st)st.textContent="Nova foto selecionada. Clique em Salvar para confirmar.";
  }catch(e){
    console.error(e);
    alert("Não foi possível preparar a foto. Tente outra imagem.");
  }
}

function resizeProductPhoto(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=reject;
    reader.onload=()=>{
      const img=new Image();
      img.onerror=reject;
      img.onload=()=>{
        const max=1200;
        let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        if(w>max||h>max){
          const scale=Math.min(max/w,max/h);
          w=Math.max(1,Math.round(w*scale));
          h=Math.max(1,Math.round(h*scale));
        }
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        // JPEG oferece arquivo menor e é ideal para fotos do cardápio.
        resolve(canvas.toDataURL("image/jpeg",0.82));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function removeProductPhoto(){
  const input=$("pi"),file=$("pfile"),img=$("photoPreview"),wrap=$("photoPreviewWrap"),rb=$("removePhotoBtn"),st=$("photoStatus");
  if(input)input.value="";
  if(file)file.value="";
  if(img)img.removeAttribute("src");
  if(wrap)wrap.style.display="none";
  if(rb)rb.style.display="none";
  if(st)st.textContent="Foto removida. Clique em Salvar para confirmar.";
}

let stockFilter="all",stockSearch="";

function normalizeStockSearch(value){
  return String(value||"")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .trim();
}

function filterStockRows(value){
  stockSearch=String(value||"");
  const q=normalizeStockSearch(stockSearch);
  const rows=[...document.querySelectorAll(".stockProductRow")];
  let shown=0;
  rows.forEach(row=>{
    const hay=String(row.dataset.search||"");
    const ok=!q||hay.includes(q);
    row.style.display=ok?"":"none";
    if(ok)shown++;
  });
  const empty=$("stockSearchEmpty");
  if(empty)empty.classList.toggle("hidden",shown>0||rows.length===0);
}

    const isLow=p=>p.stock_control&&Number(p.stock_quantity)<=Number(p.stock_low_threshold ?? 5);
    const hasCost=p=>Number(p.cost_price||0)>0;
    const low=controlled.filter(isLow);
    const noCost=a.filter(p=>!hasCost(p));
    const visible=stockFilter==="low"?a.filter(isLow):stockFilter==="nocost"?noCost:a;
    const inventoryValue=controlled.reduce((sum,p)=>sum+(Number(p.stock_quantity||0)*Number(p.cost_price||0)),0);
    $("adminContent").innerHTML=
      '<div class="panel">'+
        '<div class="row"><div><h2>📦 Estoque e custos</h2><div style="color:#aaa">'+controlled.length+' produto(s) com controle ativo • '+low.length+' precisando de reposição • '+noCost.length+' sem custo cadastrado</div></div><div style="text-align:right"><div style="color:#aaa;font-size:13px">Valor do estoque controlado</div><b style="color:#ffd34d;font-size:22px">'+R(inventoryValue)+'</b></div></div>'+

        '</div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0" class="noPrint">'+
          '<button class="'+(stockFilter==="low"?'btn':'secondary')+'" onclick="stock(\'low\')">⚠️ Estoque baixo ('+low.length+')</button>'+
          '<button class="'+(stockFilter==="nocost"?'btn':'secondary')+'" onclick="stock(\'nocost\')">💰 Sem custo ('+noCost.length+')</button>'+
          '<button class="'+(stockFilter==="all"?'btn':'secondary')+'" onclick="stock(\'all\')">📦 Mostrar todos</button>'+
          '<button class="secondary" onclick="stockCostQuick()">💰 Cadastro rápido de custos</button>'+
          '<button class="secondary" onclick="stockReplenishmentList()">🛒 Lista de reposição</button>'+
        '</div>'+
        '<div class="notice">Cadastre o custo unitário para acompanhar margem e valor do estoque. O preço de venda continua vindo do Cardápio e não é alterado nesta tela.</div>'+
        (visible.length?visible.map(p=>{
          const q=Number(p.stock_quantity||0), threshold=Number(p.stock_low_threshold ?? 5), warn=isLow(p);

      const ax=Number(x.cost_price||0)<=0?0:1, ay=Number(y.cost_price||0)<=0?0:1;
      if(ax!==ay)return ax-ay;
      return String(x.category||'').localeCompare(String(y.category||''),'pt-BR')||String(x.name||'').localeCompare(String(y.name||''),'pt-BR');
    });
    modal(
      '<div class="quickCostViewport">'+

      '<div style="margin:14px 0;display:flex;gap:8px;flex-wrap:wrap">'+
        '<button class="secondary" onclick="costQuickShowOnlyMissing()">Mostrar somente sem custo</button>'+
        '<button class="secondary" onclick="costQuickShowAll()">Mostrar todos</button>'+
      '</div>'+
      '<div id="quickCostList">'+ordered.map(p=>{
        const cost=Number(p.cost_price||0), price=Number(p.price||0), missing=cost<=0;
        const margin=price>0&&cost>0?((price-cost)/price*100):null;
        const cls=margin===null?'warn':(margin>=50?'good':(margin>=30?'warn':'bad'));
        return '<div class="quickCostRow" data-missing="'+(missing?'1':'0')+'" data-id="'+p.id+'">'+
          '<div class="quickCostProduct"><b>'+E(p.emoji||'🍽️')+' '+E(p.name)+'</b><div style="color:#999;font-size:13px">'+E(p.category||'')+'</div></div>'+
          '<div><small style="color:#999">Venda</small><div style="font-weight:900">'+R(price)+'</div></div>'+
          '<div><small style="color:#999">Custo unitário</small><input class="quickCostInput" data-id="'+p.id+'" data-original="'+(cost>0?cost.toFixed(2):'')+'" type="number" min="0" step="0.01" value="'+(cost>0?cost.toFixed(2):'')+'" placeholder="R$ 0,00"></div>'+
          '<div class="quickCostMarginWrap"><small style="color:#999">Margem</small><div id="qcm_'+p.id+'" class="quickCostMargin '+cls+'" style="font-weight:900">'+(margin===null?'—':margin.toFixed(1).replace('.',',')+'%')+'</div></div>'+
        '</div>';
      }).join('')+'</div>'+
      '<div class="quickCostFooter">'+
        '<div id="quickCostStatus" style="color:#aaa;margin-bottom:10px">Nenhum produto alterado.</div>'+
        '<button id="quickCostSaveBtn" class="btn" onclick="saveQuickCosts()" disabled>✅ Salvar alterações</button> '+
        '<button class="secondary" onclick="closeModal()">Cancelar</button>'+
      '</div></div>'
    );
    const box=document.querySelector('#modal .modalBox'); if(box)box.classList.add('quickCostModalBox');
    costQuickShowOnlyMissing();
    document.querySelectorAll('.quickCostInput').forEach(inp=>inp.addEventListener('input',()=>{
      const id=Number(inp.dataset.id), p=a.find(x=>Number(x.id)===id), price=Number(p&&p.price||0), cost=Math.max(0,Number(inp.value)||0);
      const el=document.getElementById('qcm_'+id);
      if(el){
        const margin=(price>0&&cost>0)?((price-cost)/price*100):null;
        el.textContent=margin===null?'—':(margin.toFixed(1).replace('.',',')+'%');
        el.className='quickCostMargin '+(margin===null?'warn':(margin>=50?'good':(margin>=30?'warn':'bad')));
      }
      updateQuickCostSummary();
    }));
    updateQuickCostSummary();
  }catch(e){alert(e.message)}
}

function costQuickShowOnlyMissing(){
  document.querySelectorAll('.quickCostRow').forEach(el=>el.style.display=el.dataset.missing==='1'?'grid':'none');
}
function costQuickShowAll(){
  document.querySelectorAll('.quickCostRow').forEach(el=>el.style.display='grid');
}
function quickCostChangedInputs(){
  return [...document.querySelectorAll('.quickCostInput')].filter(i=>{
    const current=String(i.value).trim();
    const original=String(i.dataset.original||'').trim();
    if(current===''&&original==='')return false;
    const a=current===''?0:Number(current), b=original===''?0:Number(original);
    return Number.isFinite(a)&&Number.isFinite(b)&&Math.abs(a-b)>0.0001;
  });
}
function updateQuickCostSummary(){
  const changed=quickCostChangedInputs();
  const status=document.getElementById('quickCostStatus');
  const btn=document.getElementById('quickCostSaveBtn');
  if(status)status.innerHTML=changed.length?'<b style="color:#ffd34d">'+changed.length+' produto(s) alterado(s)</b> aguardando salvamento.':'Nenhum produto alterado.';
  if(btn)btn.disabled=changed.length===0;
}

async function saveQuickCosts(){
  try{
    const inputs=quickCostChangedInputs();
    const items=inputs.map(i=>({id:Number(i.dataset.id),cost_price:Math.max(0,Number(i.value)||0)}));
    if(!items.length){alert('Nenhum custo foi alterado.');return}
    if(items.some(x=>!Number.isFinite(x.cost_price))){alert('Existe um custo inválido. Confira os valores.');return}
    if(!confirm('Salvar a alteração de custo de '+items.length+' produto(s)?'))return;
    const status=document.getElementById('quickCostStatus'); if(status)status.textContent='Salvando custos...';
    const r=await api('/api/stock/costs/bulk',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({items})});
    alert((r.updated||items.length)+' custo(s) atualizado(s) com sucesso.');
    closeModal();stock('all');
  }catch(e){alert(e.message)}
}

function todayLocal(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}


async function profitPanel(start,end){
  try{
    const now=todayLocal();
    const first=start||now.slice(0,8)+"01";
    const last=end||now;
    const [r,products,rulesRows]=await Promise.all([
      api("/api/reports/period?start="+encodeURIComponent(first)+"&end="+encodeURIComponent(last)),
      api("/api/admin/products"),
      api("/api/profit-rules")
    ]);
    const rules=Object.fromEntries((rulesRows||[]).map(x=>[x.normalized_name,x]));
    window.__profitPanel={report:r,products,rules,start:first,end:last};

    const total=Number(r.summary.total||0);
    const historicalCost=Number(r.summary.custo||0);
    const normName=v=>String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
    const productMap=new Map(products.map(p=>[normName(p.name),p]));
    const aliases=Object.fromEntries(Object.entries(rules).filter(([,x])=>x.alias_product_id).map(([k,x])=>[k,x.alias_product_id]));
    const historicalCosts=Object.fromEntries(Object.entries(rules).filter(([,x])=>Number(x.historical_unit_cost)>0).map(([k,x])=>[k,Number(x.historical_unit_cost)]));
    const ignoredHistorical=Object.fromEntries(Object.entries(rules).filter(([,x])=>x.ignored).map(([k,x])=>[k,true]));
    const soldAll=(r.products||[]).map(x=>{
      const key=normName(x.name);
      const aliasId=Number(aliases[key]||0);
      const p=productMap.get(key)||products.find(z=>Number(z.id)===aliasId);
      const historicalUnitCost=Number(historicalCosts[key]||0);
      const unitCost=Number(p?.cost_price||0)>0?Number(p.cost_price):historicalUnitCost;
      const qty=Number(x.quantity||0);
      const revenue=Number(x.total||0);
      const estCost=unitCost>0?unitCost*qty:null;
      const estProfit=estCost===null?null:revenue-estCost;
      const estMargin=estProfit===null||revenue<=0?null:(estProfit/revenue)*100;
      return {...x,product:p,unitCost,estCost,estProfit,estMargin,key,ignored:Boolean(ignoredHistorical[key])};
    });
    const ignoredSold=soldAll.filter(x=>x.ignored);
    const ignoredRevenue=ignoredSold.reduce((n,x)=>n+Number(x.total||0),0);
    const sold=soldAll.filter(x=>!x.ignored);
    const adjustedTotal=Math.max(0,total-ignoredRevenue);

    const soldWithoutCost=sold.filter(x=>!x.product||x.unitCost<=0);
    const unitsMissing=soldWithoutCost.reduce((n,x)=>n+Number(x.quantity||0),0);
    const revenueMissing=soldWithoutCost.reduce((n,x)=>n+Number(x.total||0),0);
    const catalogWithoutCost=products.filter(p=>Number(p.cost_price||0)<=0);
    const coveredRevenue=Math.max(0,adjustedTotal-revenueMissing);
    const coverage=adjustedTotal>0?Math.max(0,Math.min(100,(coveredRevenue/adjustedTotal)*100)):100;
    const partialProfit=coveredRevenue-historicalCost;
    const partialMargin=coveredRevenue>0?(partialProfit/coveredRevenue)*100:0;

    const statusHtml=soldWithoutCost.length
      ? '<div style="margin-top:12px;padding:12px 14px;border:1px solid #8a6500;background:#2b2200;border-radius:12px;color:#ffe082">⚠️ <b>Lucro total ainda não pode ser calculado com segurança.</b> '+soldWithoutCost.length+' produto(s) vendido(s) estão sem custo cadastrado, somando '+R(revenueMissing)+' do faturamento. Abaixo você pode cadastrar esses custos diretamente.</div>'
      : '<div style="margin-top:12px;padding:12px 14px;border:1px solid #147a44;background:#0c3f29;border-radius:12px;color:#b9ffd5">✅ <b>Cobertura completa de custos.</b> Todos os produtos vendidos no período possuem custo cadastrado.</div>';

    const activeMissing=soldWithoutCost.filter(x=>x.product);
    const historicalMissing=soldWithoutCost.filter(x=>!x.product);
    const missingRows=soldWithoutCost.map(x=>{
      const btn=x.product
        ? '<button class="secondary" onclick="productForm('+x.product.id+')">💰 Cadastrar custo</button>'
        : '<button class="secondary" onclick="historicalMatchForm('+JSON.stringify(String(x.name)).replace(/"/g,"&quot;")+')">🔗 Associar produto</button> <button class="secondary" onclick="historicalCostForm('+JSON.stringify(String(x.name)).replace(/"/g,"&quot;")+')">🕘 Custo histórico</button> <button class="danger" onclick="ignoreHistoricalSale('+JSON.stringify(String(x.name)).replace(/"/g,"&quot;")+')">🚫 Ignorar teste</button>';
      const status=x.product
        ? '<span style="color:#ffb74d;font-weight:800">⚠️ Ativo sem custo</span>'
        : '<span style="color:#90caf9;font-weight:800">🕘 Histórico não localizado</span>';
      return '<tr><td><b>'+E(x.name)+'</b></td><td>'+Number(x.quantity||0)+'</td><td>'+R(x.total)+'</td><td>'+status+'</td><td>'+btn+'</td></tr>';
    }).join("");

    const ranking=sold.slice().sort((a,b)=>Number(b.total||0)-Number(a.total||0));
    $("adminContent").innerHTML=
      '<div class="panel">'+
        '<div class="row"><div><h2>💹 Painel de lucro</h2><div style="color:#aaa">Visão gerencial de faturamento, cobertura de custos e lucro parcial</div></div></div>'+
        '<div class="reportFilters">'+
          '<div class="field"><label>Data inicial</label><input id="profitStart" type="date" value="'+E(first)+'"></div>'+
          '<div class="field"><label>Data final</label><input id="profitEnd" type="date" value="'+E(last)+'"></div>'+
          '<button class="btn" onclick="profitPanel($(\'profitStart\').value,$(\'profitEnd\').value)">Atualizar</button>'+
        '</div>'+
        '<div class="reportSummary">'+
          '<div class="reportBox"><small>Faturamento considerado</small><strong>'+R(adjustedTotal)+'</strong></div>'+
          (ignoredRevenue>0?'<div class="reportBox"><small>Vendas ignoradas</small><strong>'+R(ignoredRevenue)+'</strong></div>':'')+
          '<div class="reportBox"><small>Faturamento com custo conhecido</small><strong>'+R(coveredRevenue)+'</strong></div>'+
          '<div class="reportBox"><small>Custo conhecido nas vendas</small><strong>'+R(historicalCost)+'</strong></div>'+
          '<div class="reportBox"><small>Lucro parcial conhecido</small><strong>'+R(partialProfit)+'</strong></div>'+
          '<div class="reportBox"><small>Margem da parcela conhecida</small><strong>'+partialMargin.toFixed(1).replace(".",",")+'%</strong></div>'+
          '<div class="reportBox"><small>Cobertura de custos</small><strong>'+coverage.toFixed(1).replace(".",",")+'%</strong></div>'+
          '<div class="reportBox"><small>Faturamento sem custo</small><strong>'+R(revenueMissing)+'</strong></div>'+
          '<div class="reportBox"><small>Itens vendidos sem custo</small><strong>'+unitsMissing+'</strong></div>'+
        '</div>'+statusHtml+

        '<div class="reportSection"><h3>📌 Diagnóstico dos custos</h3>'+
          '<div class="reportSummary">'+
            '<div class="reportBox"><small>Produtos no cardápio sem custo</small><strong>'+catalogWithoutCost.length+'</strong></div>'+
            '<div class="reportBox"><small>Ativos vendidos sem custo</small><strong>'+activeMissing.length+'</strong></div>'+
            '<div class="reportBox"><small>Históricos sem correspondência</small><strong>'+historicalMissing.length+'</strong></div>'+
            '<div class="reportBox"><small>Faturamento coberto por custo</small><strong>'+R(coveredRevenue)+'</strong></div>'+
            '<div class="reportBox"><small>Faturamento ainda sem custo</small><strong>'+R(revenueMissing)+'</strong></div>'+
          '</div>'+
          '<div style="color:#aaa;font-size:13px;margin-top:8px">O <b>lucro parcial conhecido</b> considera somente a parcela do faturamento coberta por custos gravados. Enquanto a cobertura estiver abaixo de 100%, não trate esse valor como lucro total do período.</div>'+
        '</div>'+

        (ignoredSold.length?'<div class="reportSection"><h3>🚫 Vendas ignoradas no cálculo</h3><div style="color:#aaa;margin-bottom:10px">Estas vendas continuam no histórico, mas não entram no faturamento, lucro, margem, cobertura de custos ou pendências deste painel.</div><div style="overflow:auto"><table class="reportTable"><thead><tr><th>Produto</th><th>Qtd.</th><th>Faturamento</th><th>Ação</th></tr></thead><tbody>'+ignoredSold.map(x=>'<tr><td><b>'+E(x.name)+'</b></td><td>'+Number(x.quantity||0)+'</td><td>'+R(x.total)+'</td><td><button class="secondary" onclick="restoreHistoricalSale('+JSON.stringify(String(x.name)).replace(/"/g,"&quot;")+')">↩️ Voltar a considerar</button></td></tr>').join('')+'</tbody></table></div></div>':'')+

        (soldWithoutCost.length?'<div class="reportSection"><div class="row"><div><h3>⚠️ Produtos vendidos sem custo</h3><div style="color:#aaa">Itens ativos podem ser corrigidos no Cardápio. Itens históricos podem ser associados a um produto atual (por exemplo, Coração → Espeto de coração) ou receber um custo histórico quando realmente não existirem mais.</div></div><button class="secondary" onclick="stockCostQuick()">💰 Cadastro rápido de custos</button></div>'+
          '<div style="overflow:auto"><table class="reportTable"><thead><tr><th>Produto</th><th>Qtd.</th><th>Faturamento</th><th>Status</th><th>Ação</th></tr></thead><tbody>'+missingRows+'</tbody></table></div></div>':'')+

        '<div class="reportSection"><h3>🏆 Produtos vendidos no período</h3>'+
          (ranking.length?'<div style="overflow:auto"><table class="reportTable"><thead><tr><th>Produto</th><th>Qtd.</th><th>Faturamento</th><th>Custo atual</th><th>Lucro estimado*</th><th>Margem*</th></tr></thead><tbody>'+
            ranking.map(x=>'<tr><td>'+E(x.name)+(x.estProfit===null?' <span style="color:#ffb74d;font-size:12px">⚠️ sem custo</span>':'')+'</td><td>'+x.quantity+'</td><td>'+R(x.total)+'</td><td>'+(x.unitCost>0?R(x.unitCost):'—')+'</td><td>'+(x.estProfit===null?'—':R(x.estProfit))+'</td><td>'+(x.estMargin===null?'—':x.estMargin.toFixed(1).replace(".",",")+'%')+'</td></tr>').join("")+
            '</tbody></table></div><div style="color:#888;font-size:12px;margin-top:8px">* A tabela usa o custo unitário atualmente cadastrado para estimativas por produto. O resumo superior usa os custos gravados no histórico das vendas.</div>':'<div class="empty">Nenhuma venda no período.</div>')+
        '</div>'+
      '</div>';
  }catch(e){alert(e.message)}
}

function historicalSaleKey(name){
  return String(name||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
}
async function saveProfitRule(name,patch){
  const p=window.__profitPanel||{};
  const key=historicalSaleKey(name);
  const current=(p.rules&&p.rules[key])||{};
  const body={
    display_name:String(name),
    alias_product_id:patch.alias_product_id!==undefined?patch.alias_product_id:(current.alias_product_id||null),
    historical_unit_cost:patch.historical_unit_cost!==undefined?patch.historical_unit_cost:(current.historical_unit_cost||null),
    ignored:patch.ignored!==undefined?patch.ignored:Boolean(current.ignored)
  };
  await api("/api/profit-rules/"+encodeURIComponent(key),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
}
async function ignoreHistoricalSale(name){
  if(!confirm("Ignorar \""+name+"\" nos cálculos do Painel de lucro?\n\nA venda NÃO será apagada. Ela continuará no histórico, mas deixará de entrar no faturamento, lucro, margem, cobertura de custos e pendências deste painel."))return;
  try{await saveProfitRule(name,{ignored:true});const p=window.__profitPanel;profitPanel(p.start,p.end)}catch(e){alert(e.message)}
}
async function restoreHistoricalSale(name){
  try{await saveProfitRule(name,{ignored:false});const p=window.__profitPanel;profitPanel(p.start,p.end)}catch(e){alert(e.message)}
}

function historicalMatchForm(name){
  const p=window.__profitPanel;
  const products=(p&&p.products)||[];
  const key=historicalSaleKey(name);
  const current=Number((p.rules&&p.rules[key]&&p.rules[key].alias_product_id)||0);
  const opts=products.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),"pt-BR")).map(x=>'<option value="'+x.id+'" '+(Number(x.id)===current?'selected':'')+'>'+E(x.name)+(Number(x.cost_price||0)>0?' • custo '+R(x.cost_price):' • sem custo')+'</option>').join("");
  modal('<h2>🔗 Associar venda histórica</h2><div class="notice">Nome registrado na venda: <b>'+E(name)+'</b></div><div class="field"><label>Produto atual correspondente</label><select id="historicalAliasProduct"><option value="">Selecione...</option>'+opts+'</select></div><div style="color:#aaa;font-size:13px;margin:8px 0 16px">A associação fica salva no banco de dados e vale em todos os aparelhos.</div><button class="btn" onclick="saveHistoricalMatch('+JSON.stringify(name).replace(/"/g,"&quot;")+')">✅ Salvar associação</button> <button class="secondary" onclick="closeModal()">Cancelar</button>');
}
async function saveHistoricalMatch(name){
  const id=Number($("historicalAliasProduct").value||0);
  if(!id){alert("Selecione o produto atual correspondente.");return}
  try{await saveProfitRule(name,{alias_product_id:id});closeModal();const p=window.__profitPanel;profitPanel(p.start,p.end)}catch(e){alert(e.message)}
}

function historicalCostForm(name){
  const p=window.__profitPanel||{},key=historicalSaleKey(name);
  const current=Number((p.rules&&p.rules[key]&&p.rules[key].historical_unit_cost)||0);
  modal('<h2>🕘 Custo histórico</h2><div class="notice">Produto: <b>'+E(name)+'</b></div><div class="field"><label>Custo unitário histórico (R$)</label><input id="historicalCostInput" inputmode="decimal" value="'+(current>0?current.toFixed(2).replace(".",","):"")+'" placeholder="Ex.: 6,00"></div><div style="color:#aaa;font-size:13px;margin:8px 0 16px">Este custo ficará salvo no banco de dados e será usado no Painel de lucro em todos os aparelhos.</div><button class="btn" onclick="saveHistoricalCost('+JSON.stringify(name).replace(/"/g,"&quot;")+')">✅ Salvar custo histórico</button> <button class="secondary" onclick="closeModal()">Cancelar</button>');
}
async function saveHistoricalCost(name){
  const raw=String($("historicalCostInput").value||"").replace(/\./g,"").replace(",",".");
  const value=Number(raw);
  if(!Number.isFinite(value)||value<=0){alert("Informe um custo maior que zero.");return}
  try{await saveProfitRule(name,{historical_unit_cost:value});closeModal();const p=window.__profitPanel;profitPanel(p.start,p.end)}catch(e){alert(e.message)}
}

function exportPeriodCSV(){
  const r=window.__periodReport;
  if(!r){alert("Abra um relatório por período primeiro.");return}

  const rows=[
    ["Relatório por período",r.start,r.end],[],
    ["Resumo"],
    ["Total",r.summary.total],
    ["PIX total",r.summary.pix],
    ["Mercado Pago",r.summary.mercado_pago_pix||0],
    ["PIX manual",r.summary.manual_pix||0],
    ["Contas",r.summary.contas],
    ["Ticket médio",r.summary.ticket_medio],
    ["Itens vendidos",r.summary.itens],
    ["Custo conhecido",r.summary.custo||0],
    ["Faturamento sem custo",r.summary.faturamento_sem_custo||0],
    ["Itens sem custo",r.summary.itens_sem_custo||0],
    ["Lucro parcial conhecido",r.summary.lucro_bruto_parcial||0],
    ["Lucro bruto",r.summary.lucro_bruto==null?"Não calculado":r.summary.lucro_bruto],
    ["Cobertura de custos (%)",r.summary.cobertura_custos||0],[],
    ["Resumo por dia"],
    ["Data","Contas","Total"],
    ...r.days.map(d=>[d.day,d.contas,d.total]),[],
    ["Produtos vendidos"],
    ["Produto","Quantidade","Total"],
    ...r.products.map(p=>[p.name,p.quantity,p.total])
  ];

  const csv=rows.map(row=>row.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(";")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="relatorio-periodo-"+r.start+"-a-"+r.end+".csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

            r.accounts.map(a=>'<tr><td>'+E(accountDisplayLabel(a))+'</td><td>'+new Date(a.closed_at).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})+'</td><td>'+E(a.payment_source||a.payment_method||"-")+'</td><td>'+a.order_count+'</td><td>'+R(a.total)+'</td></tr>').join("")+
            '</tbody></table></div>'
          :'<div class="empty">Nenhuma conta fechada nesta data.</div>')+
        '</div>'+
        '<div class="reportSection"><h3>Produtos vendidos</h3>'+
          (r.products.length?
            '<div style="overflow:auto"><table class="reportTable"><thead><tr><th>Produto</th><th>Qtd.</th><th>Total</th></tr></thead><tbody>'+
            r.products.map(p=>'<tr><td>'+E(p.name)+'</td><td>'+p.quantity+'</td><td>'+R(p.total)+'</td></tr>').join("")+
            '</tbody></table></div>'
          :'<div class="empty">Nenhum produto vendido nesta data.</div>')+
        '</div>'+
        '<div class="reportSection"><h3>Fechamentos de caixa</h3>'+
          (r.cash.length?
            r.cash.map(c=>'<div class="saleRow"><div><b>Caixa #'+c.id+'</b><div style="color:#aaa">'+new Date(c.opened_at).toLocaleString("pt-BR")+' → '+new Date(c.closed_at).toLocaleString("pt-BR")+'</div></div><div><b>'+R(c.closing_amount)+'</b><div style="color:#aaa">Esperado: '+R(c.expected_amount)+'</div></div></div>').join("")
          :'<div class="empty">Nenhum fechamento de caixa nesta data.</div>')+
        '</div>'+
      '</div>';
  }catch(e){alert(e.message)}
}

function downloadPeriodReportPdf(){
  const r=window.__periodReport;
  if(!r){alert("Abra primeiro o relatório por período.");return}
  if(!window.jspdf||!window.jspdf.jsPDF){
    alert("Não foi possível carregar o gerador de PDF. Atualize a página e tente novamente.");
    return;
  }

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"mm",format:"a4"});
  const safe=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const money=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  const margin=Number(r.summary.total)>0?(Number(r.summary.lucro_bruto||0)/Number(r.summary.total))*100:0;
  let y=16;

  const checkPage=(need=12)=>{if(y+need>282){doc.addPage();y=16}};
  const title=t=>{
    checkPage(12);
    doc.setFont("helvetica","bold");doc.setFontSize(12);doc.text(safe(t),15,y);y+=7;
    doc.setDrawColor(150);doc.line(15,y,195,y);y+=6;
  };
  const row=(left,right)=>{
    checkPage(7);
    doc.setFont("helvetica","normal");doc.setFontSize(10);
    doc.text(safe(left),18,y);
    if(right!==undefined)doc.text(safe(right),192,y,{align:"right"});
    y+=6;
  };

  doc.setFont("helvetica","bold");doc.setFontSize(18);
  doc.text("CANTINHO DOS GIGANTES",105,y,{align:"center"});y+=9;
  doc.setFontSize(14);doc.text("RELATORIO POR PERIODO",105,y,{align:"center"});y+=7;
  doc.setFont("helvetica","normal");doc.setFontSize(10);
  const startText=new Date(r.start+"T12:00:00").toLocaleDateString("pt-BR");
  const endText=new Date(r.end+"T12:00:00").toLocaleDateString("pt-BR");
  doc.text("Periodo: "+startText+" a "+endText,105,y,{align:"center"});y+=10;

  title("RESUMO");
  row("Faturamento",money(r.summary.total));
  row("PIX",money(r.summary.pix));
  row("Dinheiro",money(r.summary.dinheiro));
  row("Cartao",money(r.summary.cartao));
  row("Contas fechadas",String(r.summary.contas||0));
  row("Ticket medio",money(r.summary.ticket_medio));
  row("Itens vendidos",String(r.summary.itens||0));
  row("Custo dos produtos vendidos",money(r.summary.custo||0));
  row("Lucro bruto",money(r.summary.lucro_bruto||0));
  row("Margem de lucro",margin.toFixed(1).replace(".",",")+"%");

  title("RESUMO POR DIA");
  if((r.days||[]).length){
    for(const d of r.days){
      const dt=new Date(d.day+"T12:00:00").toLocaleDateString("pt-BR");
      row(dt+" | "+d.contas+" conta(s)",money(d.total));
    }
  }else row("Nenhuma venda no periodo.");

  title("PRODUTOS VENDIDOS");
  if((r.products||[]).length){
    for(const p of r.products)row((p.quantity||0)+"x "+safe(p.name),money(p.total));
  }else row("Nenhum produto vendido no periodo.");

  checkPage(18);y+=5;doc.line(15,y,195,y);y+=6;
  doc.setFontSize(8);doc.text("Gerado pelo sistema Cantinho dos Gigantes em "+new Date().toLocaleString("pt-BR"),105,y,{align:"center"});

  doc.save("relatorio-periodo-"+r.start+"-a-"+r.end+".pdf");
}

function exportDailyCSV(){
  const r=window.__dailyReport;
  if(!r){alert("Abra um relatório primeiro.");return}

  const rows=[
    ["Relatório diário",r.date],[],
    ["Resumo"],
    ["Total",r.summary.total],
    ["PIX total",r.summary.pix],
    ["Mercado Pago",r.summary.mercado_pago_pix||0],
    ["PIX manual",r.summary.manual_pix||0],
    ["Contas",r.summary.contas],
    ["Faturamento",r.summary.total],
    ["Custo conhecido",r.summary.custo],
    ["Faturamento sem custo",r.summary.faturamento_sem_custo||0],
    ["Itens sem custo",r.summary.itens_sem_custo||0],
    ["Lucro parcial conhecido",r.summary.lucro_bruto_parcial||0],
    ["Lucro bruto",r.summary.lucro_bruto==null?"Não calculado":r.summary.lucro_bruto],[],
    ["Contas fechadas"],
    ["Comanda","Fechamento","Pagamento","Pedidos","Valor"],
    ...r.accounts.map(a=>[accountDisplayLabel(a),new Date(a.closed_at).toLocaleString("pt-BR"),a.payment_source||a.payment_method||"",a.order_count,a.total]),[],
    ["Produtos vendidos"],
    ["Produto","Quantidade","Total"],
    ...r.products.map(p=>[p.name,p.quantity,p.total])
  ];

  const csv=rows.map(row=>row.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(";")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="relatorio-"+r.date+".csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}


let qrCommandPage=0;
async function qrCommands(page=qrCommandPage){
  try{
    qrCommandPage=Math.max(0,Math.min(9,Number(page)||0));
    const statuses=await api("/api/qr-commands/status");
    const start=qrCommandPage*20+1,end=Math.min(start+19,200);
    let html='<div class="panel"><div class="row"><div><h2>🎟️ Comandas QR avulsas</h2><p style="color:#aaa">200 comandas reutilizáveis. Depois do PIX confirmado, a comanda fecha e volta a ficar livre.</p></div><button class="secondary" onclick="qrs()">📱 Ver mesas</button></div>'+ 
      '<div class="notice">💡 Entregue o cartão da comanda ao cliente. Numeração disponível: <b>A001 a A200</b>.</div>'+ 
      '<div class="row" style="margin-top:14px"><b>Mostrando A'+String(start).padStart(3,"0")+' até A'+String(end).padStart(3,"0")+'</b><div>'+ 
      (qrCommandPage>0?'<button class="secondary" onclick="qrCommands('+(qrCommandPage-1)+')">← Anteriores</button> ':'')+
      (qrCommandPage<9?'<button class="secondary" onclick="qrCommands('+(qrCommandPage+1)+')">Próximas →</button>':'')+'</div></div><div class="qrGrid">';
    for(let i=start;i<=end;i++){
      const code='A'+String(i).padStart(3,'0');
      const st=statuses.find(x=>x.customer_name===code)||{status:'LIVRE',total:0,order_count:0};
      const q=await api('/api/qrcode-command/'+code);
      const busy=st.status==='EM USO';
      html+='<div class="qrCard">'+
        '<div class="row"><h3>🎟️ '+code+'</h3><b style="color:'+(busy?'#ff9f43':'#166534')+'">'+(busy?'EM USO':'LIVRE')+'</b></div>'+ 
        (busy?'<p>'+Number(st.order_count||0)+' pedido(s) • <b>'+R(st.total)+'</b></p>':'<p style="color:#888">Pronta para entregar ao próximo cliente</p>')+
        '<img src="'+q.png+'" alt="QR '+code+'">'+
        '<a download="QR-Comanda-'+code+'.png" href="'+q.png+'"><button class="btn">Baixar QR</button></a>'+ 
      '</div>';
    }
    html+='</div></div>';
    $("adminContent").innerHTML=html;
  }catch(e){alert(e.message)}
}

async function qrs(){
  try{
    let html='<div class="panel"><h2>QR Codes das Mesas</h2><div class="qrGrid">';
    for(let i=1;i<=12;i++){
      const q=await api("/api/qrcode/"+i);
      html+=
        '<div class="qrCard">'+
          '<h3>MESA '+i+'</h3>'+
          '<img src="'+q.png+'" alt="QR Mesa '+i+'">'+
          '<p>'+E(q.url)+'</p>'+
          '<a download="QR-Mesa-'+i+'.png" href="'+q.png+'"><button class="btn">Baixar QR</button></a>'+
        '</div>';
    }
    html+='</div></div>';
    $("adminContent").innerHTML=html;
  }catch(e){alert(e.message)}
}
