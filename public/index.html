<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cantinho dos Gigantes</title><style>body{margin:0;background:#f4f4f2;font-family:Arial;color:#151515}.top{background:#111;color:#fff;padding:14px;display:flex;justify-content:space-between;position:sticky;top:0}.top button,.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer}.active,.btn{background:#ffb400}.wrap{max-width:1100px;margin:auto;padding:18px}.hero{background:#202326;color:#fff;border-radius:18px;padding:28px}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tabs button{padding:10px;border:1px solid #ddd;border-radius:9px;background:#fff}.sel{background:#111!important;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card,.panel,.order{background:#fff;border:1px solid #ddd;border-radius:14px;padding:15px}.pic{height:120px;background:#17191b;color:#fff;display:grid;place-items:center;font-size:60px;margin:-15px -15px 15px}.pic img{width:100%;height:100%;object-fit:cover}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.price{font-weight:bold;font-size:19px}.cart{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 16px;border-radius:12px}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#111;color:#fff;padding:15px;border-radius:10px}.stat b{display:block;font-size:23px}.orders{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center}.box{background:#fff;padding:20px;border-radius:14px;width:min(500px,92%)}input,textarea,select{width:100%;padding:10px;margin:5px 0;box-sizing:border-box}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}}</style></head><body>
<header class="top"><b>🍔 CANTINHO <span style="color:#ffb400">DOS GIGANTES</span></b><div><button class="active" onclick="client()">Cliente</button><button onclick="admin()">Admin</button></div></header><main class="wrap"><section id="app"></section></main><div id="cart" class="cart hidden"></div><div id="modal" class="modal hidden"></div>
<script>
let M,B=[],C="Todos";const $=x=>document.getElementById(x),R=v=>Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}),E=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));async function api(u,o){let r=await fetch(u,o),j=await r.json();if(!r.ok)throw Error(j.error||"Erro");return j}
async function client(){M=await api("/api/menu");let m=new URLSearchParams(location.search).get("mesa");$("app").innerHTML='<div class="hero"><h1>'+E(M.settings.name)+'</h1><p>'+E(M.settings.welcome)+'</p>'+(m?'<b>🪑 Mesa '+m+'</b>':'')+'</div><div class="tabs">'+["Todos",...M.categories.map(x=>x.name)].map(c=>'<button class="'+(c==C?"sel":"")+'" onclick="C=\''+E(c)+'\';render()">'+E(c)+'</button>').join("")+'</div><div id="products" class="grid"></div>';render()}
function render(){let p=M.products.filter(x=>C=="Todos"||x.category==C);$("products").innerHTML=p.map(x=>'<div class="card"><div class="pic">'+(x.image?'<img src="'+E(x.image)+'">':x.emoji)+'</div><h3>'+E(x.name)+'</h3><p>'+E(x.description)+'</p><div class="row"><b class="price">'+R(x.price)+'</b><button class="btn" onclick="add('+x.id+')">Adicionar</button></div></div>').join("");cart()}
function add(id){let p=M.products.find(x=>x.id==id),z=B.find(x=>x.product_id==id);z?z.quantity++:B.push({product_id:id,name:p.name,price:Number(p.price),quantity:1});cart()}
function cart(){let n=B.reduce((a,x)=>a+x.quantity,0),v=B.reduce((a,x)=>a+x.quantity*x.price,0);$("cart").classList.toggle("hidden",!n);$("cart").innerHTML='🛒 '+n+' itens • <b>'+R(v)+'</b> <button class="btn" onclick="checkout()">Finalizar</button>'}
function modal(h){$("modal").innerHTML='<div class="box">'+h+'</div>';$("modal").classList.remove("hidden")}function closeM(){$("modal").classList.add("hidden")}
function checkout(){let m=new URLSearchParams(location.search).get("mesa")||prompt("Número da mesa","1");if(!m)return;modal("<h2>Confirmar pedido</h2>"+B.map(x=>"<p>"+x.quantity+"x "+E(x.name)+" — "+R(x.quantity*x.price)+"</p>").join("")+"<textarea id='obs' placeholder='Observação'></textarea><button class='btn' onclick='send("+Number(m)+")'>Enviar pedido</button>")}
async function send(m){let r=await api("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({table:m,items:B.map(x=>({product_id:x.product_id,quantity:x.quantity})),observation:$("obs").value})});B=[];cart();modal("<h2>✅ Pedido enviado!</h2><p>Pedido #"+String(r.id).slice(-5)+"</p><button class='btn' onclick='closeM()'>OK</button>")}
async function admin(){let p=prompt("Senha do administrador");if(p==="1234")dash();else alert("Senha incorreta")}
async function dash(){let s=await api("/api/stats");$("app").innerHTML='<h1>Painel administrativo</h1><div class="stats"><div class="stat">Pedidos<b>'+s.orders+'</b></div><div class="stat">Faturamento<b>'+R(s.total)+'</b></div><div class="stat">Produtos<b>'+s.products+'</b></div><div class="stat">Mesas<b>'+s.tables+'</b></div></div><div class="tabs"><button onclick="orders()">🧾 Pedidos</button><button onclick="products()">🍔 Cardápio</button><button onclick="qrs()">🪑 QR Codes</button></div><div id="adminContent"></div>';orders()}
async function orders(){let a=await api("/api/orders");$("adminContent").innerHTML='<div class="panel"><h2>Pedidos</h2><div class="orders">'+a.map(o=>'<div class="order"><b>#'+String(o.id).slice(-5)+' — Mesa '+o.table_number+'</b><p>'+o.items.map(i=>i.quantity+"x "+E(i.name)).join("<br>")+'</p><b>'+R(o.total)+'</b><select onchange="st('+o.id+',this.value)">'+["Recebido","Em preparo","Pronto","Entregue","Cancelado"].map(s=>'<option '+(s==o.status?"selected":"")+'>'+s+'</option>').join("")+'</select></div>').join("")+'</div></div>'}
async function st(id,s){await api("/api/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:s})});orders()}
async function products(){let a=await api("/api/admin/products");$("adminContent").innerHTML='<div class="panel"><h2>Cardápio</h2><button class="btn" onclick="formP()">+ Produto</button>'+a.map(p=>'<div class="row" style="padding:10px 0;border-bottom:1px solid #ddd"><span>'+p.emoji+' <b>'+E(p.name)+'</b> — '+R(p.price)+'</span><button onclick="formP('+p.id+')">Editar</button></div>').join("")+'</div>'}
async function formP(id){let a=await api("/api/admin/products"),p=id?a.find(x=>x.id==id):{name:"",description:"",price:"",category_id:1,emoji:"🍔",image:""},c=(await api("/api/menu")).categories;modal("<h2>Produto</h2><input id='n' placeholder='Nome' value='"+E(p.name)+"'><input id='v' type='number' step='.01' placeholder='Preço' value='"+p.price+"'><select id='c'>"+c.map(x=>"<option value='"+x.id+"' "+(x.id==p.category_id?"selected":"")+">"+E(x.name)+"</option>").join("")+"</select><input id='e' value='"+E(p.emoji)+"'><textarea id='d'>"+E(p.description)+"</textarea><input id='i' placeholder='URL da foto' value='"+E(p.image||"")+"'><button class='btn' onclick='saveP("+(id||0)+")'>Salvar</button>")}
async function saveP(id){let x={name:$("n").value,description:$("d").value,price:Number($("v").value),category_id:Number($("c").value),emoji:$("e").value||"🍔",image:$("i").value||""};await api(id?"/api/products/"+id:"/api/products",{method:id?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(x)});closeM();products()}
async function qrs(){let h='<div class="grid">';for(let i=1;i<=12;i++){let q=await api("/api/qrcode/"+i);h+='<div class="card" style="text-align:center"><h3>Mesa '+i+'</h3><img src="'+q.png+'" style="max-width:180px"><p>'+q.url+'</p></div>'}$("adminContent").innerHTML=h+"</div>"}
client();</script></body></html>
