name: Validar restauracao em banco isolado
on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: 'ID da execução de backup para validar (vazio = último sucesso)'
        required: false
        type: string
permissions:
  actions: read
  contents: read
jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ephemeral-validation-only
          POSTGRES_DB: backup_validation
        options: >-
          --health-cmd "pg_isready -U postgres -d backup_validation"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Localizar backup
        id: backup
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN: ${{ inputs.backup_run_id }}
        run: |
          set -euo pipefail
          RUN_ID="$REQUESTED_RUN"
          if [ -z "$RUN_ID" ]; then
            RUN_ID="$(gh run list --workflow backup-neon.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          fi
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v7
        with:
          run-id: ${{ steps.backup.outputs.run_id }}
          github-token: ${{ github.token }}
          pattern: backup-aiven-*
          merge-multiple: true
          path: restore
      - name: Descriptografar backup sem acessar produção
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$BACKUP_PASSWORD"
          test -s restore/backup.dump.enc
          if [ -f restore/backup.dump.enc.sha256 ]; then
            (cd restore && sha256sum --check backup.dump.enc.sha256)
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -in restore/backup.dump.enc -out backup.dump -pass env:BACKUP_PASSWORD
      - name: Restaurar e conferir no PostgreSQL temporário
        env:
          RESTORE_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/validate-restore.sh
      - name: Limpar arquivos temporários
        if: always()
        run: rm -f backup.dump restore/backup.dump.enc restore/backup.dump.enc.sha256
