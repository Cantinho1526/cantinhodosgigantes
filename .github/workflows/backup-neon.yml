name: Backup diário Neon

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Criar backup PostgreSQL 18
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker run --rm \
            -e DATABASE_URL \
            -v "$PWD:/backup" \
            postgres:18 \
            sh -c 'pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges --file=/backup/backup.dump && pg_restore --list /backup/backup.dump > /backup/backup-list.txt'

      - name: Proteger backup com senha
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in backup.dump \
            -out backup.dump.enc \
            -pass env:BACKUP_PASSWORD

          rm -f backup.dump
          rm -f backup-list.txt

      - name: Guardar backup criptografado
        uses: actions/upload-artifact@v4
        with:
          name: backup-neon-${{ github.run_number }}
          path: backup.dump.enc
          retention-days: 90
          if-no-files-found: error
