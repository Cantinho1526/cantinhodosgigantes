name: Backup diario Aiven
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backup-aiven
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ephemeral-validation-only
          POSTGRES_DB: backup_validation
        options: >-
          --health-cmd "pg_isready -U postgres -d backup_validation"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Criar backup PostgreSQL 18 com certificado validado
        env:
          AIVEN_DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$AIVEN_DATABASE_URL"
          test -n "$DATABASE_CA_CERT" || { echo 'Configure DATABASE_CA_CERT com o CA do Aiven.'; exit 1; }
          printf '%s' "$DATABASE_CA_CERT" > ca.pem
          AIVEN_DATABASE_URL="$(python3 scripts/secure-backup-url.py)"
          export AIVEN_DATABASE_URL
          docker run --rm -e AIVEN_DATABASE_URL -v "$PWD:/backup" postgres:18 \
            sh -ec 'pg_dump --dbname="$AIVEN_DATABASE_URL" --format=custom --no-owner --no-privileges --file=/backup/backup.dump; pg_restore --list /backup/backup.dump > /backup/backup-list.txt'
          test -s backup.dump
      - name: Proteger e conferir criptografia
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_PASSWORD"
          # Mantém os parâmetros anteriores para compatibilidade com backups antigos.
          openssl enc -aes-256-cbc -salt -pbkdf2 -in backup.dump -out backup.dump.enc -pass env:BACKUP_PASSWORD
          openssl enc -d -aes-256-cbc -pbkdf2 -in backup.dump.enc -out roundtrip.dump -pass env:BACKUP_PASSWORD
          cmp backup.dump roundtrip.dump
          sha256sum backup.dump.enc > backup.dump.enc.sha256
      - name: Restaurar cópia em banco temporário e conferir integridade
        env:
          RESTORE_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/validate-restore.sh
      - name: Guardar backup criptografado
        uses: actions/upload-artifact@v6
        with:
          name: backup-aiven-${{ github.run_number }}
          path: |
            backup.dump.enc
            backup.dump.enc.sha256
          retention-days: 90
          if-no-files-found: error
      - name: Remover arquivos temporários
        if: always()
        run: rm -f backup.dump roundtrip.dump backup-list.txt backup.dump.enc backup.dump.enc.sha256 ca.pem
